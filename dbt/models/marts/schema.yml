version: 2

models:

  - name: dim_cargo
    description: "Cargos do TSE com esfera, duracao de mandato e vagas em disputa em 2026."
    columns:
      - name: cod_cargo
        tests: [not_null, unique]
      - name: descricao
        tests: [not_null]
      - name: esfera
        tests:
          - accepted_values:
              arguments:
                values: [federal, estadual, distrital, municipal]
      - name: duracao_mandato_anos
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [4, 8]
                quote: false
      - name: modulo_durante_mandato
        description: >
          TRUE apenas para Presidente e Governador. SPEC 2.2 mantem deputados e
          senadores fora do modulo "Durante o mandato" de proposito.
      - name: vagas_2026
        description: "Somatorio de `consulta_vagas` de 2026. NULL para cargo fora da disputa."

  - name: dim_candidato
    description: "Uma linha por candidatura-pessoa. Chave: sk_candidatura."
    columns:
      - name: nr_candidato
        description: >
          Numero de urna. Largura varia por cargo: 2 digitos em Presidente e
          Governador, 3 em Senador, 4 em Deputado Federal, 5 em Estadual.
        tests: [not_null]
      - name: sk_candidatura
        description: >
          (ano_eleicao, sg_ue, sq_candidato) concatenados. `sq_candidato` sozinho
          nao serve como chave: so' e' globalmente unico a partir de 2010 — em 2002
          e 2006 o mesmo numero aparece em ate' 27 UFs.
        tests: [not_null, unique]
      - name: sq_candidato
        description: "Numero do TSE. Unico dentro da UE; global so' a partir de 2010."
        tests: [not_null]
      - name: id_pessoa
        description: >
          Chave que liga a mesma pessoa entre eleicoes: cpf_hash quando ha' CPF,
          senao hash de nome normalizado + data de nascimento (ADR-005).
      - name: link_confiavel
        description: "FALSE quando `id_pessoa` veio do fallback nome+nascimento."
        tests: [not_null]
      - name: idade_na_posse
        description: >
          Idade em 1o de janeiro do ano seguinte a eleicao, calculada sobre a data
          de nascimento COMO A FONTE PUBLICA. Pode ser impossivel: o cadastro do
          TSE tem erros de digitacao (21 casos em 180.718). Nao e' corrigida aqui.
      - name: idade_plausivel
        description: >
          FALSE quando a idade calculada cai fora de [17, 110]. **NULL quando nao ha'
          data de nascimento na fonte** (457 candidaturas em 180.718) — ausencia de
          dado nao e' o mesmo que dado impossivel, e o modelo nao mistura os dois.
      - name: idade_na_posse_valida
        description: >
          Igual a `idade_na_posse` quando plausivel, NULL quando nao. E' esta que
          as medidas de perfil usam, para que uma data errada na fonte nao entre
          na mediana.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 17
                max_value: 110
                inclusive: true
      - name: cod_cargo
        tests:
          - relationships:
              arguments:
                to: ref('dim_cargo')
                field: cod_cargo
      - name: url_foto
        description: >
          URL publica da foto oficial de urna no Cloud Storage (F-13 / ADR-012).
          O warehouse guarda a URL, nunca o binario. NULL quando a fonte nao
          publica foto para aquela candidatura.
      - name: tem_foto
        description: "Conveniencia para filtro e para a medida de cobertura."
        tests: [not_null]

  - name: dim_partido
    description: "Estado do partido em cada eleicao (sigla, numero, federacao)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sigla_partido, ano_eleicao]
    columns:
      - name: sk_partido
        tests: [not_null, unique]
      - name: sigla_partido
        tests: [not_null]

  - name: dim_tempo
    description: "Calendario anual de 1980 ao ano corrente."
    columns:
      - name: ano
        tests: [not_null, unique]

  - name: fct_candidatura
    description: "F-05 — uma candidatura por linha. Grao: sk_candidatura."
    columns:
      - name: sk_candidatura
        tests: [not_null, unique]
      - name: sq_candidato
        tests: [not_null]
      - name: ano_eleicao
        tests: [not_null]
      - name: cod_cargo
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cargo')
                field: cod_cargo
      - name: sg_uf
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_uf')
                field: sg_uf
      - name: is_reeleicao
        description: >
          DERIVADO do historico de mandatos, nao lido da fonte: em 2026 o TSE
          publica `ST_REELEICAO` como `#NE` ate' a apuracao (conferido 27/08/2026).
        tests: [not_null]
      - name: total_bens_declarados
        description: >
          Soma dos bens em reais correntes do ano da eleicao. Zero quando nao
          declarou. Pode ser negativo, embora seja raro: saldo de conta corrente
          negativo entra na soma com sinal (ver `stg_tse__bens.valor_bem`).
        tests: [not_null]
      - name: votos_nominais
        description: >
          Votos nominais somados dos turnos disputados (S4). NULL para 2026 porque
          a eleicao ainda nao ocorreu — nao por falta de dado.
      - name: votos_1o_turno
        description: "Separado do total: comparar candidatos que disputaram numeros diferentes de turnos exige o 1o turno."
      - name: votos_2o_turno
      - name: proposta_obrigatoria
        description: >
          TRUE para cargos 1, 3 e 5. Vem da LEI, nao do dado: e' o que permite a
          tela dizer "nao se aplica a este cargo" em vez de deixar campo vazio.
        tests: [not_null]
      - name: tem_proposta_governo
        description: "TRUE quando o DivulgaCandContas lista arquivo `codTipo = 5` (F-14)."
        tests: [not_null]
      - name: url_proposta_oficial
        description: >
          Link para a pagina do candidato no DivulgaCandContas. O projeto nao
          hospeda o PDF (ADR-013) — o leitor confere na fonte.
      - name: nome_arquivo_proposta
        description: "Nome do arquivo como o candidato enviou."

  - name: fct_mandato
    description: "F-05 — um mandato exercido por linha. Base do modulo 'Durante o mandato'."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [id_pessoa, cod_cargo, sg_ue, ano_inicio]
    columns:
      - name: sk_mandato
        tests: [not_null, unique]
      - name: id_pessoa
        tests: [not_null]
      - name: ano_inicio
        tests: [not_null]
      - name: ano_fim
        tests: [not_null]
      - name: cod_cargo
        tests:
          - relationships:
              arguments:
                to: ref('dim_cargo')
                field: cod_cargo
      - name: motivo_fim
        description: >
          `interrompido` = houve eleicao suplementar para o mesmo cargo e UE dentro
          da janela, entao o mandato original terminou antes. `nao informado` nao
          significa "fim regular": renuncia e morte no exercicio nao estao na fonte.
        tests:
          - accepted_values:
              arguments:
                values: ["cassacao", "interrompido", "nao informado"]
      - name: is_eleicao_suplementar
        description: >
          Mandato conquistado em eleicao suplementar — o titular assume no proprio
          ano da eleicao, nao no seguinte. O pacote de 2014 traz duas (AM 2017 e
          TO 2018), ambas rotuladas com ANO_ELEICAO=2014 pela fonte.
        tests: [not_null]
      - name: anos_de_mandato
        description: "Duracao efetiva da janela. Menor que `duracao_mandato_anos` quando interrompido ou suplementar."
        tests: [not_null]

  - name: fct_indicador_uf_ano
    description: "F-04/F-05 — indicador x UF x ano com comparador nacional e regional na mesma linha."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cod_indicador, sg_uf, ano]
    columns:
      - name: cod_indicador
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_indicador')
                field: cod_indicador
      - name: sg_uf
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_uf')
                field: sg_uf
      - name: ano
        tests: [not_null]
      - name: valor
        tests: [not_null]
      - name: valor_brasil
        description: >
          Mesmo indicador e ano, agregado nacional. Existe para que nenhum numero
          de UF possa ser exibido sem comparador (Constituicao 0.2).

  - name: fct_mandato_indicador_ausente
    description: >
      Por que um indicador NAO aparece na ficha de um mandato. A Regra 5 proibe
      preencher buraco de dado, e `fct_mandato_indicador` cumpre: o par
      simplesmente nao existe. Este modelo existe para a tela poder DIZER que nao
      existe, e por que — ausencia silenciosa e' lida como omissao. Ver ADR-031.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sk_mandato, cod_indicador]
    columns:
      - name: sk_mandato
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_mandato')
                field: sk_mandato
      - name: cod_indicador
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_indicador')
                field: cod_indicador
      - name: motivo
        description: >
          `serie_comeca_depois` (o caso do desemprego em mandato anterior a 2012),
          `serie_termina_antes`, `serie_nao_cobre_a_janela` (menos de dois anos
          com dado dentro da janela — serie decenal cai muito aqui) e
          `sem_serie_para_a_unidade`.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [serie_comeca_depois, serie_termina_antes,
                         serie_nao_cobre_a_janela, sem_serie_para_a_unidade]
      - name: ente_medido
        description: "Herdado de `dim_indicador`; a aplicabilidade por cargo segue o ADR-029."
        tests: [not_null]

  - name: fct_mandato_indicador
    description: >
      F-06 — o que aconteceu com o indicador durante a janela do mandato, com os
      comparadores Brasil e regiao. NAO mede efeito de gestao.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sk_mandato, cod_indicador]
    columns:
      - name: sk_mandato
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_mandato')
                field: sk_mandato
      - name: cod_indicador
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_indicador')
                field: cod_indicador
      - name: ano_referencia_inicio
        description: "Ano do ponto inicial de fato usado — em geral o ano anterior a posse."
        tests: [not_null]
      - name: ano_referencia_fim
        tests: [not_null]
      - name: janela_incompleta
        description: >
          TRUE quando a serie termina antes do fim do mandato (defasagem de
          divulgacao). A tela obrigatoriamente sinaliza.
        tests: [not_null]
      - name: base_e_heranca
        description: "TRUE quando o ponto inicial e' mesmo o ano anterior a posse."
        tests: [not_null]
      - name: delta_vs_brasil
        description: >
          variacao_pct - variacao_brasil_pct. Contraste descritivo entre duas
          variacoes observadas no mesmo periodo. Nunca rotular como resultado.
      - name: aviso_metodologico
        description: "Texto fixo que acompanha o registro onde quer que ele seja exibido."
        tests: [not_null]

  - name: fct_mudanca_candidatura
    description: >
      Cada mudanca observada numa candidatura de 2026. Serie construida por captura
      diaria e **irreproduzivel depois de 04/10/2026** — o TSE publica o estado
      atual, nunca o historico.
    columns:
      - name: sk_candidatura
        description: >
          NAO tem relacionamento obrigatorio com `fct_candidatura`: uma candidatura
          pode ter sido capturada aqui e depois sumido da publicacao do TSE. Quem
          marca isso e' `consta_na_lista_atual`, e o volume e' vigiado pelo
          `assert_sumico_de_candidatura_e_raro`.
        tests: [not_null]
      - name: consta_na_lista_atual
        description: >
          FALSE = a candidatura desapareceu da ultima publicacao do TSE. E' o evento
          que este modelo existe para registrar, nao um defeito.
        tests: [not_null]
      - name: data_observacao
        description: >
          Dia em que o pipeline VIU a mudanca — nao o dia do ato do TSE. Com
          execucao diaria, localiza o evento com precisao de um dia.
        tests: [not_null]
      - name: dias_desde_observacao_anterior
        description: >
          Torna explicita a incerteza da data: se o pipeline ficou tres dias sem
          rodar, a mudanca aconteceu em algum ponto desses tres dias.
      - name: versao
        description: "Sempre >= 2: a versao 1 e' a primeira observacao, nao uma mudanca."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 2
                inclusive: true
      - name: aviso_temporal
        tests: [not_null]

  - name: fct_votacao_uf
    description: >
      Votos por candidatura, turno e UF de deposito. Responde "onde este candidato
      foi mais votado". Sem quebra por municipio — ver docs/LACUNAS.md, L-19.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sk_candidatura, nr_turno, sg_uf]
    columns:
      - name: sk_candidatura
        tests: [not_null]
      - name: sg_uf
        description: >
          Onde a urna estava, NAO a unidade disputada. Para presidente inclui `ZZ`
          (exterior) e, em 2010, `VT` (voto em transito).
        tests: [not_null]
      - name: votos_nominais
        tests: [not_null]
      - name: pct_do_total_do_candidato
        description: "Participacao daquela UF no total do candidato naquele turno."

  - name: fct_votacao_municipio
    description: >
      Votos por municipio para Presidente e Governador — a base do mapa eleitoral.
      Restrito a esses dois cargos por escopo (L-19).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sk_candidatura, nr_turno, cd_municipio]
    columns:
      - name: sk_candidatura
        tests: [not_null]
      - name: cd_municipio
        tests: [not_null]
      - name: cod_cargo
        description: "So' 1 (Presidente) e 3 (Governador)."
        tests:
          - accepted_values:
              arguments:
                values: [1, 3]
                quote: false
      - name: pct_do_municipio
        description: >
          Participacao do candidato no total daquele municipio, cargo e turno. E'
          o numero que torna municipios de tamanhos diferentes comparaveis num mapa.

  - name: dim_parlamentar
    description: >
      Parlamentar em exercicio resolvido contra o cadastro do TSE (F-15). Uma linha
      por (casa, id_casa). A resolucao tenta `cpf_hash` primeiro e so' cai para
      nome + data de nascimento quando a fonte nao publica CPF, que e' o caso do
      Senado inteiro.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [casa, id_casa]
    columns:
      - name: casa
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [camara, senado]
      - name: id_casa
        tests: [not_null]
      - name: metodo_id_pessoa
        description: >
          Como a identidade foi estabelecida. `cpf` e' afirmacao da fonte;
          `nome_nascimento` e' deducao nossa; `ambiguo` e `sem_correspondencia`
          nao produzem `id_pessoa`.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [cpf, nome_nascimento, ambiguo, sem_correspondencia]
      - name: casamento_confiavel
        description: >
          TRUE so' quando veio por CPF. A tela usa isso para marcar que a
          identidade de um senador foi inferida, e nao confirmada pela fonte.
        tests: [not_null]
      - name: id_ambiguo
        tests: [not_null]

  - name: fct_atividade_senado
    description: >
      F-22 — atividade legislativa por senador, ano e classe, contando SO'
      autoria principal. Fecha a L-20. Espelha `fct_atividade_legislativa`; os
      dois nunca sao somados nem comparados entre si.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [id_casa, ano, classe_proposicao]
    columns:
      - name: id_casa
        description: "`codigoParlamentar` do Senado. Nao tem relacao com o `id_deputado` da Camara."
        tests: [not_null]
      - name: classe_proposicao
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [normativa, fiscalizacao, relatoria, procedimental]
      - name: qt_proposicoes
        description: >
          Quantas proposicoes o senador apresentou como AUTOR PRINCIPAL naquele
          ano e naquela classe. Nunca somar as classes: rito e producao normativa
          sao ordens de grandeza diferentes.
        tests: [not_null]
      - name: id_pessoa
        description: "Nulo quando a ponte de identidade (F-15) nao casou."

  - name: fct_atividade_legislativa
    description: >
      Atividade legislativa por deputado, ano e CLASSE de proposicao (F-16). A
      classe faz parte do grao de proposito: nao existe linha "total do deputado",
      porque somar projeto de lei com requerimento de retirada de pauta produz um
      numero sem significado. So' entra quem e' proponente — assinatura de apoio
      foi descartada na ingestao.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [id_deputado, ano, classe_proposicao]
    columns:
      - name: id_deputado
        tests: [not_null]
      - name: ano
        tests: [not_null]
      - name: classe_proposicao
        description: >
          `normativa` propos norma; `fiscalizacao` pediu contas ao Executivo;
          `relatoria` analisou o texto de outro (NAO e' autoria); `procedimental`
          e' rito e homenagem; `outra` e' residuo.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [normativa, fiscalizacao, relatoria, procedimental, outra]
      - name: qt_proposicoes
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: qt_destino_desconhecido
        description: >
          Proposicoes com situacao em branco na fonte. NAO sao "em tramitacao" —
          o destino simplesmente nao foi publicado, e a tela nao pode contar
          ausencia de informacao como andamento.
        tests: [not_null]
      - name: ligado_ao_tse
        description: >
          FALSE para quem nao esta' mais em exercicio: a legislatura 2023-2026
          passou por 710 deputados por suplencias e licencas, e a ponte cobre os
          513 de hoje. A linha continua valida como atividade da Camara, mas nao
          chega a' ficha de nenhum candidato.
        tests: [not_null]

  - name: fct_financiamento_candidatura
    description: >
      Receita de campanha por candidatura e ORIGEM do recurso. A origem faz parte
      da chave porque o total sozinho esconde o unico fato que o dado responde bem:
      em 2026, 92% do dinheiro de campanha do pais e' recurso de partido.
      Nao existe ranking — ordenar politicos por dinheiro e' placar (Constituicao 0.1).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sk_candidatura, origem_recurso]
    columns:
      - name: sk_candidatura
        tests: [not_null]
      - name: origem_recurso
        tests: [not_null]
      - name: vl_receita
        description: >
          Somavel entre linhas, ao contrario de `fct_atividade_legislativa`: sao
          parcelas do mesmo dinheiro, nao categorias incomparaveis.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: qt_doadores
        description: >
          Doadores DISTINTOS, nao lancamentos. Cinquenta transferencias da mesma
          pessoa sao um doador, e a diferenca e' o fato politico.
        tests: [not_null]
      - name: vl_autofinanciamento
        description: "Recurso proprio do candidato, isolado do que veio de terceiros."
        tests: [not_null]

  - name: fct_comissao_deputado
    description: >
      Onde cada deputado sentou, com que papel e por quanto tempo. Um colegiado
      por linha, com os periodos somados: a Camara renova a composicao todo ano e
      o mesmo deputado reaparece na mesma comissao a cada renovacao — 25
      deputados produziram 490 assentos em comissao permanente, quase todos
      repetindo o mesmo colegiado.
      Filiacao partidaria e comissao de medida provisoria NAO entram: estar no PT
      nao e' ter assento na CCJ, e sao 1.393 comissoes de MPV no catalogo.
      So' entra quem tem `casamento_confiavel` — na Camara isso e' CPF (ADR-014).
      Sem ele, um assento na CCJ poderia ser atribuido a um homonimo.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [id_pessoa, id_orgao]
    columns:
      - name: id_pessoa
        tests: [not_null]
      - name: classe_orgao
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [mesa, permanente, temporaria, conselho, mista]
      - name: papel_principal
        description: >
          O papel de MAIOR PESO que a pessoa teve naquele colegiado, pela
          hierarquia formal (Presidente > Vice > Relator > Titular > Suplente).
          Nao e' juizo sobre a pessoa: e' escolher, entre fatos igualmente
          verdadeiros, o mais informativo — como a trajetoria mostra o resultado
          do turno decisivo e nao a soma dos turnos.
      - name: qt_periodos
        description: "Quantas vezes a pessoa foi designada para aquele colegiado."
        tests: [not_null]
      - name: em_curso
        description: >
          Ao menos um periodo sem data de fim. Vinculo sem fim esta' em curso;
          preencher com a data de hoje faria a tela dizer que terminou hoje,
          todo dia.
        tests: [not_null]

  - name: fct_comissao_senador
    description: >
      Onde cada senador sentou, com que papel e por quanto tempo. Espelha
      `fct_comissao_deputado`, com duas diferencas que a tela precisa dizer.
      A identidade e' INFERIDA: o Senado nao publica CPF, entao o filtro e'
      `id_pessoa is not null` — casamento por nome + nascimento, o mesmo criterio
      que `fct_atividade_senado` ja' usa em producao (ADR-034). `casamento_confiavel`
      e `metodo_id_pessoa` seguem ate' o fim para a ressalva na ficha.
      O papel vem de DUAS rotas unidas na ingestao: `/comissoes` da' quem sentou
      (Titular, Suplente, Nato) e `/cargos` da' quem comandou (Presidente, Vice,
      Relator, Secretario) mais os colegiados que a primeira nao conhece — a
      Mesa Diretora inclusive. Fecha a L-30. Ver ADR-049.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [id_pessoa, codigo_colegiado]
    columns:
      - name: id_pessoa
        tests: [not_null]
      - name: classe_colegiado
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [mesa, permanente, temporaria, conselho, mista]
      - name: origem_da_classe
        description: >
          `catalogo` quando o tipo veio do `CodigoTipoColegiado` da fonte, `nome`
          quando foi deduzido da forma oficial escrita por extenso. O catalogo do
          Senado so' cobre colegiado em atividade, e o que ficava de fora era
          justamente o de maior peso publico — CPMI do INSS, CPI da Pandemia,
          Comissao Representativa do Congresso. Ver ADR-048.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [catalogo, nome]
      - name: papel_principal
        description: >
          O papel de maior peso pela hierarquia FORMAL do colegiado — Presidente
          > Vice > Secretario/Corregedor > Relator > Coordenador > Titular >
          Nato > Suplente. Nao e' juizo sobre a pessoa: e' escolher, entre fatos
          igualmente verdadeiros, o mais informativo.
          A fonte escreve o ordinal junto ("1o VICE-PRESIDENTE"), e o vice e'
          testado ANTES do presidente — "VICE-PRESIDENTE" contem "PRESIDENTE", e
          a ordem inversa promoveria todo vice a presidente.
          E' o papel de TODA a trajetoria ali, nao o de agora. Para o de agora,
          `papel_atual` — combinar este com `em_curso` faria a CDH aparecer com
          cinco presidentes simultaneos.
        tests: [not_null]
      - name: papel_atual
        description: >
          O papel de maior peso entre os periodos ABERTOS, e NULO quando nenhum
          esta' aberto. E' esse nulo que impede a tela de dizer "Presidente, em
          curso" de quem presidiu ha' dez anos e hoje e' apenas titular.
      - name: comanda_agora
        description: >
          A pessoa ocupa AGORA um posto de direcao naquele colegiado. Diferente
          de `teve_comando`, que vale para toda a trajetoria.
        tests: [not_null]
      - name: qt_periodos
        description: >
          Quantas vezes a pessoa foi DESIGNADA para aquele colegiado. Cargo de
          comando nao entra: as duas rotas descrevem o mesmo periodo por angulos
          diferentes, e somar produziria o dobro.
          Vale ZERO em colegiado que so' aparece em `/cargos` — a Mesa Diretora
          e' o caso. Nao e' buraco: e' a fonte publicando o cargo sem publicar a
          designacao.
        tests: [not_null]
      - name: qt_cargos
        description: "Quantos cargos de comando a pessoa teve naquele colegiado."
        tests: [not_null]
      - name: teve_comando
        description: >
          A pessoa ocupou algum posto de direcao ali — presidencia, vice,
          secretaria, corregedoria, relatoria ou coordenacao.
        tests: [not_null]
      - name: em_curso
        description: >
          Ao menos um periodo sem data de fim. Preencher com a data de hoje faria
          a tela dizer que terminou hoje, todo dia.
        tests: [not_null]

  - name: fct_bem_candidatura
    description: >
      Bens declarados por candidatura e TIPO, agrupados pela tabela oficial de
      Bens e Direitos da Receita Federal que o TSE reusa. A ficha mostrava um
      total e uma contagem; a fonte tem 76.724 itens so' em 2026.
      `descricao_bem` NAO entra neste mart de proposito: e' texto livre e contem
      endereco residencial (6,8% das linhas de 2026), placa, chassi, CPF e CNPJ.
      O que nao chega ao mart nao chega a' tela por descuido de quem escrever a
      proxima consulta. Ver o cabecalho do modelo.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sk_candidatura, cd_tipo_bem]
    columns:
      - name: sk_candidatura
        tests: [not_null]
      - name: cd_tipo_bem
        description: "Codigo oficial da tabela de Bens e Direitos (Receita/TSE)."
        tests: [not_null]
      - name: grupo_bem
        description: >
          Dezena do codigo oficial, que JA' e' o agrupamento da fonte: 01-19
          imoveis, 21-29 moveis, 31-39 participacoes, 41-49 aplicacoes, 51-59
          creditos, 61-69 dinheiro, 71-79 fundos, 91-99 outros. Classificar pelo
          NOME seria adivinhar — foi o erro que a L-20 custou caro (ADR-034).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [imoveis, moveis, participacoes, aplicacoes, creditos,
                         dinheiro, fundos, outros]
      - name: qt_itens
        tests: [not_null]
      - name: vl_total
        description: >
          Somavel entre linhas da mesma candidatura: sao parcelas do mesmo
          patrimonio declarado, nao categorias incomparaveis.
          PODE SER NEGATIVO: saldo de conta corrente no cheque especial entra na
          declaracao com sinal negativo e o TSE publica assim (4 linhas em 2026,
          todas em deposito bancario). Um teto inferior de zero aqui reprovaria
          um dado correto — quem cuida do caso e' o teste singular
          `assert_bem_negativo_so_em_deposito`, que falha se o negativo aparecer
          num imovel ou num veiculo.
        tests: [not_null]

  - name: fct_patrimonio_declarado
    description: >
      Patrimonio declarado por pessoa e eleicao, desde 2006. Existe para a ficha
      poder mostrar as declaracoes LADO A LADO.
      NAO ha' coluna de variacao nem percentual: o TSE pede valor de AQUISICAO e
      nao de mercado, os valores sao NOMINAIS, e a declaracao e' do proprio
      candidato. Um "+10%" na tela afirmaria crescimento onde pode haver queda
      real, compra ou venda. Ano sem declaracao nao vira linha de valor zero
      (Regra 5).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [id_pessoa, ano_eleicao]
    columns:
      - name: id_pessoa
        tests: [not_null]
      - name: ano_eleicao
        tests: [not_null]
      - name: vl_total_declarado
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: qt_itens
        tests: [not_null]

  - name: fct_doador_candidatura
    description: >
      Quem financiou cada candidatura, ja' somando as doacoes repetidas da mesma
      origem. Responde a pergunta que a prestacao de contas existe para responder e
      que a lista crua de 43 mil lancamentos nao responde.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sk_candidatura, sk_doador]
    columns:
      - name: sk_candidatura
        tests: [not_null]
      - name: sk_doador
        tests: [not_null]
      - name: doador_cnpj
        description: >
          EM CLARO de proposito, e NULL para pessoa fisica. CNPJ identifica empresa,
          partido ou comite — nao e' dado pessoal, e e' o que permite ver a mesma
          empresa financiando candidaturas de partidos diferentes (ADR-020).
      - name: nome_doador
        description: >
          Vem do maior lancamento, nao de `any_value`: quando a mesma identidade
          aparece com grafias diferentes, a que acompanha o maior valor e' a que o
          leitor tem mais chance de reconhecer.
      - name: vl_doado
        tests: [not_null]
      - name: e_o_proprio_candidato
        description: >
          Separa recurso proprio de repasse entre candidaturas. Sao 434 repasses
          reais em 2026, contra 6.446 lancamentos de dinheiro do proprio bolso.
        tests: [not_null]
