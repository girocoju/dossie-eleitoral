version: 2

models:

  - name: stg_tse__candidaturas
    description: >
      F-03 — candidaturas de 1998 a 2026 com schema unico. Grao:
      (sq_candidato, ano_eleicao, nr_turno).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sk_candidatura, nr_turno]
    columns:
      - name: sk_candidatura
        description: >
          Chave da candidatura: (ano_eleicao, sg_ue, sq_candidato). Ver o macro
          `sk_candidatura` — `sq_candidato` sozinho so' e' unico a partir de 2010.
        tests: [not_null]
      - name: sq_candidato
        description: "Numero do TSE. Nao e' chave de pessoa nem chave global."
        tests: [not_null]
      - name: ano_eleicao
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1998, 2002, 2006, 2010, 2014, 2018, 2022, 2026]
                quote: false
      - name: cod_cargo
        description: "Codigo de cargo do TSE. 1..10 sao os cargos das eleicoes gerais."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cargo')
                field: cod_cargo
      - name: sg_uf
        description: "UF da candidatura. `BR` aparece nas candidaturas a Presidente."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_uf')
                field: sg_uf
      - name: nr_turno
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: cpf_hash
        description: "HMAC-SHA256 do CPF. Chave de pessoa entre anos (ADR-005/006)."
      - name: nome_completo
        tests: [not_null]
      - name: sigla_partido
        tests: [not_null]
      - name: foi_eleito
        description: >
          TRES estados. TRUE/FALSE quando o TSE publicou o resultado do turno;
          NULL quando NAO publicou — 2026 inteiro, e 13.834 candidaturas de
          1998-2022, entre elas os 8 presidenciaveis de 2006 (L-16).
          NAO tem `not_null`, e isso e' deliberado: era o teste que obrigava o
          macro a inventar FALSE, e o FALSE inventado dizia na ficha do Lula que
          ele nao foi eleito em 2006.
      - name: data_nascimento
        description: "NULL quando a fonte traz data-sentinela."
      - name: despesa_max_campanha
        description: "Limite legal de gasto, nao gasto realizado. Financiamento e' F-11 (fase 2)."

  - name: stg_tse__bens
    description: "Bens declarados por candidatura (S2). Grao: um bem."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sk_candidatura, nr_ordem_bem]
    columns:
      - name: sq_candidato
        tests: [not_null]
      - name: valor_bem
        description: >
          Valor declarado em reais correntes do ano da eleicao — nao deflacionado.
          PODE SER NEGATIVO: saldo de conta corrente no cheque especial e' um bem
          declarado com sinal negativo. Conferido em 27/08/2026: 5 dos 76.410 bens
          de 2026 sao negativos, todos do tipo deposito bancario, o menor
          -R$ 38.101,07. Nao e' erro de parsing — o valor bruto no CSV do TSE ja'
          vem `-38101,07`.
        tests: [not_null]

  - name: stg_tse__vagas
    description: "Vagas em disputa por cargo e unidade eleitoral (S5)."
    columns:
      - name: qt_vagas
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: cod_cargo
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cargo')
                field: cod_cargo

  - name: stg_tse__coligacoes
    description: "Coligacoes e federacoes por cargo e UE (S5)."
    columns:
      - name: sq_coligacao
        tests: [not_null]

  - name: stg_indicadores
    description: >
      F-04 — indicadores socioeconomicos de todas as fontes no formato longo
      (cod_indicador, sg_uf, ano, valor).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cod_indicador, sg_uf, ano]
    columns:
      - name: cod_indicador
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_indicador')
                field: cod_indicador
      - name: sg_uf
        description: "27 UFs mais `BR`, que guarda o agregado nacional comparador."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_uf')
                field: sg_uf
      - name: ano
        tests: [not_null]
      - name: valor
        tests: [not_null]
      - name: n_periodos
        description: >
          Quantas medidas da fonte entraram no valor anual. 1 para series anuais;
          4 para a media dos trimestres da PNAD Continua.

  - name: stg_tse__fotos
    description: "S13 — foto oficial de urna por candidatura. Guarda URL, nunca binario (ADR-012)."
    columns:
      - name: sk_candidatura
        tests: [not_null, unique]
      - name: url_foto
        tests: [not_null]
      - name: tamanho_bytes
        description: "Mediana medida: 5 KB. Serve para detectar imagem corrompida ou vazia."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true

  - name: stg_tse__propostas
    description: "S14 — existencia da proposta de governo por candidatura majoritaria."
    columns:
      - name: sk_candidatura
        tests: [not_null, unique]
      - name: tem_proposta_governo
        tests: [not_null]
      - name: url_proposta_oficial
        tests: [not_null]
      - name: cod_cargo
        description: >
          So' Presidente (1) e Governador (3) — os cargos que a Lei 9.504/97 obriga.
          Senador nao entra: medido em 28/08/2026, 0 de 318 tem proposta.
        tests:
          - accepted_values:
              arguments:
                values: [1, 3]
                quote: false

  - name: stg_tse__votacao
    description: >
      S4 — votos por candidatura e turno, agregados na ingestao a partir do grao
      municipio x zona. Validado contra o resultado historico de 1998.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sk_candidatura, nr_turno]
    columns:
      - name: sk_candidatura
        tests: [not_null]
      - name: votos_nominais
        description: >
          Em 1998 o TSE publica `QT_VOTOS_NOMINAIS` zerado e o valor em
          `_VALIDOS`; nos anos recentes e' o contrario. A regra de escolha esta'
          explicita no modelo.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: n_linhas_agregadas
        description: "Quantas linhas de municipio x zona entraram nesta soma."
        tests: [not_null]

  - name: stg_camara__parlamentares
    description: >
      Parlamentares em exercicio nas duas Casas, com as DUAS chaves possiveis de
      identidade (`cpf_hash` e `chave_nome_nascimento`). Nao resolve `id_pessoa` —
      quem resolve e' `dim_parlamentar`, que enxerga o cadastro do TSE.
    columns:
      - name: id_casa
        tests: [not_null]
      - name: chave_nome_nascimento
        description: >
          Hash de nome sem acento + data de nascimento, calculado SEMPRE, mesmo
          quando ha' CPF. E' a unica chave que casa com o Senado, que nao publica
          CPF.

  - name: stg_camara__proposicoes
    description: >
      Proposicoes da Camara em que um deputado e' PROPONENTE. O filtro acontece na
      ingestao: em 2025, 21,4% das linhas de autoria eram apoio, e num requerimento
      com 264 assinaturas 263 eram apoio.
    columns:
      - name: id_proposicao
        tests: [not_null]
      - name: id_deputado
        tests: [not_null]
      - name: total_assinantes
        description: >
          Fica visivel de proposito: um projeto com 1 assinante e um com 264 nao
          dizem a mesma coisa sobre quem propos.
        tests: [not_null]

  - name: stg_tse__financiamento
    description: >
      Receitas declaradas de campanha, um lancamento por linha. O CPF do doador
      pessoa fisica nao existe neste modelo nem na tabela abaixo dele: a ingestao
      o substitui por HMAC antes de gravar (ADR-020).
    columns:
      - name: sq_receita
        tests: [not_null, unique]
      - name: sk_candidatura
        tests: [not_null]
      - name: valor
        description: >
          Ja' chega FLOAT64 — a conversao do decimal brasileiro acontece em Python,
          na ingestao. E' a excecao do projeto e esta' anotada no modelo.
        tests: [not_null]
      - name: sk_doador
        description: >
          Identidade estavel do doador: CNPJ quando empresa, hash de CPF quando
          pessoa. Nome sozinho nao serve — homonimia fundiria gente diferente.
      - name: doador_tipo
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [fisica, juridica, "nao informado"]
      - name: e_autofinanciamento
        description: >
          TRUE quando o doador-candidato e' o proprio candidato da linha. Sem esta
          coluna, os 6.446 lancamentos de recurso proprio de 2026 apareceriam como
          apoio de terceiros.
        tests: [not_null]

  - name: stg_tse__despesas_campanha
    description: >
      Despesas CONTRATADAS de campanha. "Paga" e' subconjunto e responde outra
      pergunta — quanto ja' saiu do caixa, nao quanto foi comprometido.
    columns:
      - name: sq_despesa
        tests: [not_null, unique]
      - name: sk_candidatura
        tests: [not_null]
      - name: valor
        tests: [not_null]
      - name: fornecedor_tipo
        tests:
          - accepted_values:
              arguments:
                values: [fisica, juridica, "nao informado"]
