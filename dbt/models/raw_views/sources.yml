version: 2

sources:
  - name: raw_tse
    description: >
      Copia fiel dos pacotes do TSE Dados Abertos, tudo em STRING (SPEC 4).
      Carregada por `ingest/tse.py`, particionada por intervalo de inteiros sobre
      `ano_eleicao` (ADR-009). A carga substitui a tabela inteira a partir dos
      NDJSON em `data/staging`, entao reexecutar nunca duplica.
    database: "{{ env_var('DOSSIE_GCP_PROJECT', 'radar-brasil-ddi') }}"
    schema: raw_tse
    config:
      loaded_at_field: _extracted_at
      freshness:
        # Ate' a eleicao o TSE republica o pacote todo dia; uma semana sem
        # atualizacao antes de 04/10/2026 e' problema.
        warn_after: { count: 8, period: day }
        error_after: { count: 21, period: day }
    tables:
      - name: candidatos
        description: "S1 — consulta_cand. Um registro por candidatura x turno."
        columns:
          - name: sq_candidato
            description: "Chave do TSE para a candidatura DENTRO de uma eleicao. Nao e' chave de pessoa."
          - name: cpf_hash
            description: >
              HMAC-SHA256 do CPF, calculado na ingestao. O CPF em claro nunca e'
              gravado (Constituicao 0.7 / ADR-006, ADR-007).
          - name: _extras
            description: "JSON com as colunas da fonte que o layout do ano nao mapeou."
      - name: bens
        description: "S2 — bem_candidato. Um registro por bem declarado."
      - name: vagas
        description: "S5 — consulta_vagas. Vagas em disputa por cargo e unidade eleitoral."
      - name: coligacoes
        description: "S5 — consulta_coligacao."
      - name: fotos
        description: >
          S13 — uma linha por foto oficial de urna enviada ao bucket publico.
          Guarda a URL, nunca o binario (ADR-012).
        columns:
          - name: url_foto
            description: "URL publica no Cloud Storage. Caminho deterministico e estavel."
      - name: votacao
        description: >
          S4 — votos por candidatura e turno, JA AGREGADOS na ingestao. A fonte tem
          grao municipio x zona (~10 milhoes de linhas por eleicao); somar antes de
          subir e' o que mantem o custo perto de zero (Constituicao 0.5).
      - name: votacao_municipio
        description: >
          S4 com grao MUNICIPAL, restrito a Presidente e Governador. E' a base do
          mapa eleitoral. O recorte por cargo e' o que mantem a tabela na casa das
          centenas de milhares em vez de dezenas de milhoes (L-19).
      - name: propostas
        description: >
          S14 — existencia da proposta de governo por candidatura majoritaria,
          consultada no DivulgaCandContas. Guarda link, nunca PDF (ADR-013).
      - name: chapas
        description: >
          S14b — quem concorre com quem: o vinculo entre titular e vice/suplente
          (F-21). Vice e suplente JA' estao em `candidatos` com candidatura
          propria; o que nao existe no pacote em lote e' a chapa. So' o
          DivulgaCandContas tem, no campo `vices` do detalhe.
        columns:
          - name: ordem
            description: >
              Posicao na lista da fonte. Importa para senador: o 1o suplente
              assume antes do 2o.
      - name: financiamento_receitas
        description: >
          S18 — receitas declaradas de campanha, um registro por lancamento. O CPF
          do doador pessoa fisica NAO existe nesta tabela: a ingestao o substitui
          por HMAC antes de gravar (ADR-020).
        columns:
          - name: doador_cpf_hash
            description: >
              HMAC-SHA256 do CPF do doador, com o mesmo salt do candidato. Permite
              agrupar doacoes da mesma pessoa sem guardar o numero.
          - name: doador_cnpj
            description: >
              CNPJ EM CLARO, de proposito. Identifica empresa, partido ou comite —
              nao e' dado pessoal, e e' o que permite rastrear doador institucional.
          - name: e_autofinanciamento
            description: >
              TRUE quando o doador-candidato e' o proprio candidato. Em 2026, 6.446
              dos 6.880 lancamentos com doador-candidato sao isto — sem a distincao,
              autofinanciamento seria lido como rede de apoio entre candidaturas.
      - name: financiamento_despesas
        description: >
          S18 — despesas CONTRATADAS (nao pagas). "Paga" e' subconjunto e responde
          outra pergunta; misturar daria um numero que nao e' nenhum dos dois.
      - name: complementar
        description: >
          S3 — consulta_cand_complementar. Em 2026 o TSE moveu para ca' situacao de
          julgamento, reeleicao, despesa maxima e declaracao de bens. Chaveada por
          sq_candidato, sem sg_uf nem cd_cargo.

  - name: raw_ibge
    database: "{{ env_var('DOSSIE_GCP_PROJECT', 'radar-brasil-ddi') }}"
    schema: raw_ibge
    config:
      loaded_at_field: _extracted_at
      freshness:
        warn_after: { count: 45, period: day }
        error_after: { count: 120, period: day }
    tables:
      - name: indicadores
        description: "S6 — formato longo (cod_indicador, sg_uf, ano, valor) vindo do SIDRA."

  - name: raw_tesouro
    description: >
      S11 — receita e despesa orcamentaria dos governos estaduais, da Declaracao de
      Contas Anuais do SICONFI. E' o indicador com o vinculo mais forte com um
      mandato executivo: e' o orcamento que o governador administra.
    database: "{{ env_var('DOSSIE_GCP_PROJECT', 'radar-brasil-ddi') }}"
    schema: raw_tesouro
    config:
      loaded_at_field: _extracted_at
      freshness:
        warn_after: { count: 120, period: day }
        error_after: { count: 400, period: day }
    tables:
      - name: emendas
        description: >
          F-27 — emendas parlamentares, do download em lote do Portal da
          Transparencia (CGU). ARQUIVO UNICO CUMULATIVO: o ano no endereco e'
          ignorado pelo Portal, e os treze anos devolvem o mesmo sha256. Sao
          94.463 linhas cobrindo emendas de 2014 a 2026, com valor ja' acumulado.
        columns:
          - name: autor_e_pessoa
            description: >
              `false` para RELATOR GERAL, bancada, comissao e para as 15.962
              linhas (17%) que o Portal publica SEM autor. Nenhuma delas pode ir
              para a ficha de um candidato — seria atribuir a uma pessoa o que a
              fonte atribui a um colegiado, ou a ninguem (L-29).
          - name: ano_emenda
            description: >
              A unica dimensao temporal que a fonte oferece. NAO ha' ano de
              execucao: os valores sao acumulados.
      - name: indicadores
        description: >
          Formato longo (cod_indicador, sg_uf, ano, valor), 2015-2025. SO' estados —
          o orcamento federal esta' em `rtn`, por causa da L-22.
      - name: rtn
        description: >
          S18 — Resultado do Tesouro Nacional, Governo Central, 1997-2025. Receita
          liquida, despesa primaria e resultado primario. SUBSTITUI as series da
          Uniao vindas da DCA, que incluiam operacoes de credito na receita e por
          isso nao mediam resultado fiscal (L-22, ADR-017).

  - name: raw_ipea
    database: "{{ env_var('DOSSIE_GCP_PROJECT', 'radar-brasil-ddi') }}"
    schema: raw_ipea
    config:
      loaded_at_field: _extracted_at
      freshness:
        warn_after: { count: 45, period: day }
        error_after: { count: 120, period: day }
    tables:
      - name: indicadores
        description: "S7 — formato longo vindo do Ipeadata (Atlas da Violencia)."

  - name: raw_legislativo
    description: >
      F-15 e F-16 — Camara dos Deputados e Senado Federal.

      `parlamentares` e a ponte de identidade: liga quem esta em exercicio hoje a
      pessoa que o projeto conhece do TSE. A Camara publica CPF e o casamento e
      exato; o Senado nao publica, e o casamento por nome + data de nascimento
      viaja marcado em `casamento_confiavel = false`.

      `proposicoes` e a atividade legislativa da Camara, ja filtrada por
      `proponente = 1` na ingestao — assinatura de apoio nunca entra.
    database: "{{ env_var('DOSSIE_GCP_PROJECT', 'radar-brasil-ddi') }}"
    schema: raw_legislativo
    config:
      loaded_at_field: _extracted_at
      freshness:
        warn_after: { count: 45, period: day }
        error_after: { count: 120, period: day }
    tables:
      - name: parlamentares
        description: "513 deputados + 81 senadores em exercicio, com o metodo de casamento."
      - name: votos_deputado
        description: >
          S19 — como cada deputado votou, AGREGADO por (deputado, ano) na
          ingestao. A fonte tem centenas de milhares de votos individuais por
          ano; 2003-2026 seriam dezenas de milhoes. O dossie usa o volume e a
          distribuicao, nao o voto avulso (ADR-025).
      - name: presenca_deputado
        description: >
          S19 — em quantos eventos o deputado esteve, por ano, com plenario
          separado de comissao. NAO ha' taxa: a fonte nao diz a quantos eventos
          ele DEVIA comparecer, e sem denominador nao existe percentual honesto.
        columns:
          - name: qt_eventos_plenario
            description: >
              Sessao de plenario e reuniao de comissao sao trabalhos diferentes;
              somar os dois num numero so' esconderia isso.
      - name: parlamentares_historico
        description: >
          S15b — deputados de legislaturas JA' ENCERRADAS (52a a 56a, 2003-2023),
          com CPF. Carga manual e' de proposito: legislatura encerrada nao muda, e
          a varredura custa uma requisicao por deputado (~50 min no total).
          Tabela separada de `parlamentares` porque a carga diaria SUBSTITUI
          aquela, e apagaria este trabalho (ADR-024).
        columns:
          - name: id_legislatura
            description: "52 a 56. A 57a (atual) vive em `parlamentares`."
          - name: cpf_hash
            description: >
              100% preenchido na medicao de 29/08/2026 — a Camara publica CPF no
              detalhe do deputado, inclusive de quem ja' saiu. E' o que permite
              casar com o TSE sem risco de homonimia.
      - name: senado_autoria
        description: >
          F-22 — uma linha por (processo, senador autor), fechando a L-20. O
          Senado nao publica arquivo em bloco com a marca de autoria: ela so'
          existe no DETALHE de cada processo, e por isso a ingestao mantem um
          indice em disco do que ja' extraiu.
        columns:
          - name: autor_principal
            description: >
              `ordem_assinatura = 1` — o equivalente do `proponente = 1` da
              Camara, validado contra o campo oficial `IndicadorAutorPrincipal`
              do endpoint antigo em 48 comparacoes, sem divergencia. A tela conta
              SO' estas; as coautorias ficam gravadas para que a separacao possa
              ser conferida, nunca somada por engano.
          - name: classe_proposicao
            description: >
              Mesmas quatro classes da Camara, mapeadas a partir da lista OFICIAL
              de siglas do Senado — nao do formato da sigla. `RQI` parece
              "Requerimento de Informacao" e e' "Requerimento da Comissao de
              Servicos de Infraestrutura".
      - name: camara_comissoes
        description: >
          F-26 — uma linha por (deputado, orgao, periodo): onde cada deputado
          sentou, com que papel e quando. Cobre 2003 em diante.
          O endpoint `/deputados/{id}/orgaos` SEM parametro de data devolve quase
          nada — Arthur Lira, que presidiu a Casa, volta com um vinculo so'. A
          ingestao pede a janela explicita.
        columns:
          - name: classe_orgao
            description: >
              Derivada do `codTipoOrgao` OFICIAL, nunca do nome do tipo. O tipo 15
              chama-se "COORDENADORIA DA MULHER" e agrupa a Bancada Negra, a
              Secretaria de Comunicacao e mais onze orgaos: renderizar o nome
              como veio diria que a Bancada Negra e' a Coordenadoria da Mulher.
              `partidaria` (partido, bloco, lideranca) fica gravada e NAO e'
              promovida a colegiado — estar no PT nao e' ter assento na CCJ.
          - name: papel
            description: >
              Titular, Suplente, Presidente, Vice-Presidente, Relator. Vem do
              campo `titulo` da API.
      - name: senado_comissoes
        description: >
          F-29 — uma linha por (senador, colegiado, periodo): onde cada senador
          sentou, com que papel e quando. Fecha a L-28.
          O catalogo de colegiados do Senado so' lista o que esta' EM ATIVIDADE,
          e nao ha' rota de detalhe que resolva o encerrado — `/comissao/{codigo}`
          responde vazio e os parametros de inativos sao ignorados.
        columns:
          - name: classe_colegiado
            description: >
              Derivada do `CodigoTipoColegiado` OFICIAL quando o colegiado esta'
              no catalogo; da forma oficial do nome por extenso quando nao esta'.
              Nunca da sigla — e' ali que mora a armadilha do ADR-034.
              `frente` e `grupo_amizade` ficam gravadas e NAO sao promovidas a
              colegiado em `fct_comissao_senador`: sao adesao aberta, nao assento.
          - name: origem_da_classe
            description: >
              `catalogo`, `nome` ou `nenhuma`. Diz se o tipo veio da fonte ou foi
              deduzido do nome oficial. `nenhuma` NAO entra na ficha — medido em
              05/09/2026, 215 de 7.226 vinculos (3,0%), quase todos comissoes
              temporarias encerradas entre 1984 e 2013 cujo nome nao diz o tipo.
          - name: papel
            description: >
              Titular, Suplente ou Nato — so' isso. A rota do Senado NAO devolve
              presidencia nem relatoria, ao contrario da Camara, entao a ficha de
              senador nao afirma quem presidiu um colegiado.
      - name: proposicoes
        description: >
          Proposicoes da legislatura 2023-2026 em que um deputado e PROPONENTE.
          Uma linha por (proposicao, proponente). Classificada em
          `classe_proposicao`: normativa, fiscalizacao, relatoria, procedimental.

  - name: raw_inep
    description: >
      S8 — IDEB por UF e Brasil, 2005-2025 (11 edicoes bienais). E' a serie com
      melhor encaixe em janela de mandato do projeto: um mandato de governador
      contem duas ou tres medicoes.
    database: "{{ env_var('DOSSIE_GCP_PROJECT', 'radar-brasil-ddi') }}"
    schema: raw_inep
    config:
      loaded_at_field: _extracted_at
      freshness:
        warn_after: { count: 400, period: day }
        error_after: { count: 800, period: day }
    tables:
      - name: indicadores
        description: "Formato longo (cod_indicador, sg_uf, ano, valor), rede publica."
