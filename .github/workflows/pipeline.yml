name: pipeline

# F-10 — ingestao + dbt DIARIO ate' a eleicao, e verificacao em todo PR.
#
# Dois jobs de proposito:
#   `verificar` roda SEMPRE e nao precisa de nenhum segredo — e' o portao de merge.
#   `pipeline`  roda so' quando ha' credenciais GCP (push na main, agendado ou manual).
# Assim um PR vindo de fork continua sendo verificado sem expor segredo nenhum.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # DIARIO as 11:00 em Brasilia: so' o que muda todo dia (TSE, fotos, propostas,
    # legislativo). As fontes anuais rodam no cron de domingo, logo abaixo. O cron do GitHub Actions so' entende UTC, e o
    # Brasil nao tem mais horario de verao desde 2019 (Decreto 9.772/2019), entao
    # UTC-3 vale o ano inteiro e 11:00 BRT = 14:00 UTC, sem excecao em nenhum mes.
    #
    # POR QUE DIARIO: o TSE republica o pacote todo dia ate' 04/10/2026 e publica
    # sempre o ESTADO ATUAL, sem historico. Um dia sem rodar e' um dia de historico
    # perdido para sempre — nao da' para recuperar depois. E' isso que sustenta o
    # snapshot da situacao das candidaturas.
    #
    # Depois do 2o turno (25/10/2026) da' para voltar a semanal — ver docs/STATUS.md.
    #
    # AVISO do GitHub: agendamento em horario "redondo" e' o horario de pico da
    # plataforma e a fila pode atrasar a execucao em dezenas de minutos. Nao e'
    # problema aqui — o que importa e' rodar uma vez por dia, nao rodar as 11:00
    # em ponto.
    - cron: "0 14 * * *"
    # DOMINGO as 11:30 de Brasilia: as fontes ANUAIS. Ver a etapa "Ingestao
    # socioeconomica" para o porque de nao rodarem todo dia.
    - cron: "30 14 * * 0"
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos do TSE a recarregar (separados por espaco)"
        default: "2026"
        required: false

env:
  RADAR_GCP_PROJECT: ${{ vars.RADAR_GCP_PROJECT || 'radar-brasil' }}
  RADAR_BQ_LOCATION: ${{ vars.RADAR_BQ_LOCATION || 'US' }}
  RADAR_LOG_LEVEL: INFO

jobs:

  verificar:
    name: lint + testes + dbt parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dbt,dev]"

      - name: Lint
        run: ruff check ingest tests scripts

      - name: Testes unitarios (sem rede)
        run: pytest -m "not network and not bigquery"

      - name: Seeds em dia com as fontes de verdade
        run: python scripts/gerar_seeds.py --check

      - name: dbt parse
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: |
          dbt deps
          dbt parse --no-partial-parse

  pipeline:
    name: ingestao + dbt build
    runs-on: ubuntu-latest
    needs: verificar
    # Sem service account configurada o job e' pulado em vez de falhar vermelho.
    if: >
      github.event_name != 'pull_request' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       github.ref == 'refs/heads/main')
    # UMA execucao por vez, e o run NOVO cancela o antigo.
    #
    # Sem isso, dois runs simultaneos gravam nas MESMAS tabelas do BigQuery e o
    # ultimo a terminar vence — inclusive um run antigo, com codigo antigo. Em
    # 28/08/2026 um run de 48 minutos ainda em voo recarregou o SICONFI com a
    # versao que ainda coletava a Uniao pela DCA e ressuscitou 22 linhas de
    # indicadores ja' removidos do catalogo.
    #
    # `cancel-in-progress: true` porque a carga e' idempotente e o dado mais novo
    # sempre vence: nao ha' motivo para terminar uma carga ja' obsoleta.
    #
    # O grupo fica AQUI, no job, e NAO no nivel do workflow. Grupos de
    # concorrencia sao globais no repositorio: declarar o mesmo nome nos dois
    # niveis faz o run tomar o grupo e o proprio job dele nunca conseguir
    # adquiri-lo — o job morre sem receber runner, em menos de um segundo, sem
    # log nenhum. Foi o que aconteceu aqui, e a assinatura e' facil de confundir
    # com cota de Actions estourada.
    concurrency:
      group: pipeline-${{ github.ref }}
      cancel-in-progress: true
    # Necessario para o OIDC do GitHub: e' o token de identidade que substitui a
    # chave de service account (ADR-011).
    permissions:
      contents: read
      id-token: write
    env:
      RADAR_DBT_TARGET: ci
      RADAR_CPF_SALT: ${{ secrets.RADAR_CPF_SALT }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir se ha' credenciais
        id: cred
        run: |
          if [ -z "${{ vars.RADAR_WIF_PROVIDER }}" ]; then
            echo "temos=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Variavel RADAR_WIF_PROVIDER ausente — etapa de carga pulada (ver docs/STATUS.md)."
          else
            echo "temos=true" >> "$GITHUB_OUTPUT"
          fi

      # Autenticacao SEM CHAVE: o GitHub emite um token OIDC, o GCP troca por
      # credencial de curta duracao. Nenhum segredo de longa duracao existe.
      - name: Autenticar no Google Cloud (Workload Identity Federation)
        if: steps.cred.outputs.temos == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.RADAR_WIF_PROVIDER }}
          service_account: ${{ vars.RADAR_WIF_SERVICE_ACCOUNT }}

      - uses: actions/setup-python@v5
        if: steps.cred.outputs.temos == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        if: steps.cred.outputs.temos == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dbt,dev]"

      - name: Cache dos pacotes baixados
        if: steps.cred.outputs.temos == 'true'
        uses: actions/cache@v4
        with:
          path: data/raw
          key: fontes-${{ hashFiles('ingest/layouts/*.yml') }}-${{ github.run_id }}
          restore-keys: fontes-${{ hashFiles('ingest/layouts/*.yml') }}-

      # `carga` roda um modulo de ingestao e traduz o codigo de saida:
      #
      #     0    ok
      #    75    falha TRANSITORIA de rede -> aviso, e a execucao segue
      #  outro   erro de verdade -> derruba o job
      #
      # Quem classifica e' `ingest/common/cli.py`, pela CAUSA da excecao: timeout
      # e 5xx sao instabilidade, 404 e 403 significam que a fonte mudou. A
      # diferenca importa — tratar tudo como transitorio faria uma fonte movida
      # parar de atualizar em silencio, que e' pior que o job vermelho.
      #
      # Sem isto, em 29/08/2026 um timeout de tres minutos do SIDRA e depois um
      # da API da Camara derrubaram a carga do TSE do dia e a publicacao junto.
      - name: Preparar o executor de cargas
        if: steps.cred.outputs.temos == 'true'
        run: |
          cat > "$RUNNER_TEMP/carga.sh" <<'SH'
          #!/usr/bin/env bash
          rotulo="$1"; shift
          set +e
          python -m "$@"
          codigo=$?
          set -e
          if [ "$codigo" -eq 0 ]; then
            exit 0
          elif [ "$codigo" -eq 75 ]; then
            echo "::warning title=Fonte indisponivel::$rotulo nao atualizou: falha transitoria de rede. O dado anterior continua valendo no BigQuery."
            echo "nao atualizou (rede): $rotulo" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          else
            echo "::error::$rotulo falhou com codigo $codigo — nao e' instabilidade de rede."
            exit "$codigo"
          fi
          SH
          chmod +x "$RUNNER_TEMP/carga.sh"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Recarregar 2026 substitui APENAS a particao de 2026 (ADR-010); o historico
      # 1998-2022 no BigQuery nao e' tocado e nao precisa estar em disco aqui.
      - name: Ingestao TSE
        if: steps.cred.outputs.temos == 'true'
        run: |
          for ano in ${{ github.event.inputs.anos || '2026' }}; do
            # FATAL de proposito, mesmo em falha de rede: o TSE publica so' o
            # ESTADO ATUAL, e o snapshot do dia alimenta a serie de alteracoes
            # que nao da' para reconstruir depois. Perder isso em silencio seria
            # pior que o job vermelho — o vermelho da' chance de re-executar.
            python -m ingest.tse load --ano "$ano"
          done

      # SEMANAL, nao diario. Todas estas fontes publicam UMA VEZ POR ANO ou perto
      # disso: DCA do SICONFI, IDEB (bienal), RTN, PIB, Censo, IDHM (decenal).
      #
      # O comentario anterior aqui dizia que o SICONFI rodava "sem custo
      # relevante". Estava errado: sao 594 consultas com pausa de 1,5s, dois
      # anexos cada — cerca de 30 minutos, o maior custo isolado do pipeline. Num
      # repositorio privado isso e' minuto de Actions medido, e a execucao diaria
      # sozinha consumia perto da cota mensal gratuita.
      #
      # O que REALMENTE muda todo dia e' o TSE (situacao das candidaturas), e essa
      # etapa continua diaria.
      # MELHOR ESFORCO, e nao fatal — a assimetria e' deliberada.
      #
      # Estas cinco fontes sao ANUAIS e ja' estao no BigQuery: uma execucao que
      # nao as atualiza deixa o dado do jeito que ja' estava, sem buraco nenhum.
      # Ja' o TSE publica apenas o ESTADO ATUAL, sem historico — um dia sem rodar
      # e' um dia perdido para sempre.
      #
      # Fatal, este passo inverte as prioridades: em 29/08/2026 um timeout da API
      # do SIDRA derrubou o job inteiro, custou o snapshot do TSE do dia e ainda
      # impediu a publicacao do site. Uma indisponibilidade do IBGE nao pode
      # decidir se o dossie sai do ar.
      #
      # Cada fonte roda por conta propria, para que a queda de uma nao esconda as
      # outras quatro, e o que falhou vira `::warning::` visivel na execucao — nao
      # silencio. Nenhum dado e' inventado para cobrir a ausencia; o valor antigo
      # simplesmente permanece, com o `_extracted_at` antigo, que e' o que a tela
      # ja' mostra ao leitor.
      - name: Ingestao socioeconomica (semanal, melhor esforco)
        if: >
          steps.cred.outputs.temos == 'true' &&
          (github.event_name != 'schedule' || github.event.schedule == '30 14 * * 0')
        run: |
          falhas=""
          for fonte in ibge_sidra ipeadata siconfi ideb rtn; do
            case "$fonte" in
              ibge_sidra|ipeadata) args="load --somente-verificados" ;;
              *)                   args="load" ;;
            esac
            echo "::group::$fonte"
            set +e
            python -m "ingest.$fonte" $args
            codigo=$?
            set -e
            if [ "$codigo" -eq 0 ]; then
              echo "$fonte ok"
            elif [ "$codigo" -eq 75 ]; then
              falhas="$falhas $fonte"
              echo "::warning title=Fonte anual nao atualizada::$fonte nao respondeu nesta execucao. O dado anterior continua valendo no BigQuery, com o _extracted_at antigo."
            else
              # Nao e' instabilidade: fonte que mudou de endereco, layout novo,
              # bug. Engolir isso faria a serie parar de atualizar em silencio.
              echo "::error::$fonte falhou com codigo $codigo — nao e' rede."
              exit "$codigo"
            fi
            echo "::endgroup::"
          done
          if [ -n "$falhas" ]; then
            echo "nao atualizadas nesta execucao:$falhas" >> "$GITHUB_STEP_SUMMARY"
          fi

      # O upload pula o que ja' esta' no bucket, entao a execucao diaria custa uma
      # listagem por UE e sobe so' foto de candidatura nova ou substituida.
      - name: Ingestao das fotos (F-13)
        if: steps.cred.outputs.temos == 'true'
        run: carga.sh "Fotos (F-13)" ingest.fotos load --ano 2026

      # Reconsulta so' registros com mais de 7 dias, entao na maioria dos dias
      # esta etapa faz zero requisicoes ao DivulgaCandContas.
      - name: Proposta de governo dos majoritarios (F-14)
        if: steps.cred.outputs.temos == 'true'
        run: carga.sh "Propostas de governo (F-14)" ingest.propostas load --ano 2026

      # Baixa o PDF e extrai o texto so' de quem ainda nao tem transcricao —
      # 206 planos, mas a maioria ja' esta' no BigQuery na execucao seguinte.
      - name: Texto integral dos planos (ADR-019)
        if: steps.cred.outputs.temos == 'true'
        run: carga.sh "Texto dos planos (ADR-019)" ingest.planos load

      # A ponte de identidade muda a cada licenca e suplencia, entao vale rodar
      # diariamente: sao ~600 requisicoes leves.
      - name: Parlamentares em exercicio (F-15)
        if: steps.cred.outputs.temos == 'true'
        run: carga.sh "Parlamentares (F-15)" ingest.legislativo load

      # Os arquivos anuais da Camara sao grandes (~500 MB na legislatura inteira),
      # mas o download e' idempotente por sha256: so' rebaixa o do ano corrente,
      # que e' o unico que muda.
      - name: Atividade legislativa da Camara (F-16)
        if: steps.cred.outputs.temos == 'true'
        run: carga.sh "Atividade legislativa (F-16)" ingest.proposicoes load

      # Um ZIP de 15 MB com 27 CSV por tipo. Ate' 04/10 o TSE republica conforme as
      # campanhas prestam contas, entao a cobertura sobe a cada dia — em 28/08/2026
      # eram 7.722 das 20.765 candidaturas.
      - name: Financiamento de campanha (F-11, ADR-020)
        if: steps.cred.outputs.temos == 'true'
        run: carga.sh "Financiamento (F-11)" ingest.financiamento load --ano 2026

      - name: dbt build
        if: steps.cred.outputs.temos == 'true'
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        # `dbt build` e' o comando certo aqui, e nao `run` + `snapshot` separados:
        # ele executa seeds, snapshots, modelos e testes na ordem do DAG. Com os
        # comandos separados, `fct_mudanca_candidatura` era construida ANTES do
        # snapshot do dia e saia sempre uma execucao atrasada.
        run: |
          dbt deps
          dbt build

      # Trava contra a regressao silenciosa mais cara possivel: o historico sumir
      # do BigQuery sem ninguem perceber. Falha o job se `fct_mandato` encolher.
      - name: Conferir que o historico continua la
        if: steps.cred.outputs.temos == 'true'
        run: python scripts/verificar_historico.py

      - name: Frescor das fontes
        if: steps.cred.outputs.temos == 'true'
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: dbt source freshness

      - name: Guardar relatorio de carga
        if: always() && steps.cred.outputs.temos == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qa-carga
          path: |
            data/staging/qa/
            dbt/target/run_results.json
          retention-days: 30
          if-no-files-found: ignore

  # ── Publicacao ───────────────────────────────────────────────────────────────
  #
  # JOB SEPARADO do `pipeline`, de proposito. Sao falhas de natureza diferente:
  # o `pipeline` cuida do dado, e a publicacao cuida do site. Uma queda de FTP na
  # Hostinger nao deve pintar de vermelho uma carga que deu certo — nem o
  # contrario. Separados, cada um se re-executa sozinho.
  #
  # `needs: pipeline` garante que o site sai do BigQuery JA' recarregado do dia,
  # e nao da versao anterior.
  publicar:
    name: gerar e publicar o dossie
    runs-on: ubuntu-latest
    needs: pipeline
    # NUNCA em pull request: um PR de fork nao publica no site de producao.
    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.pipeline.result == 'success'
    concurrency:
      group: publicar-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Conferir se ha' credenciais
        id: cred
        run: |
          if [ -z "${{ vars.RADAR_WIF_PROVIDER }}" ] || [ -z "${{ secrets.HOSTINGER_HOST }}" ]; then
            echo "temos=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Credenciais de GCP ou de FTP ausentes — publicacao pulada."
          else
            echo "temos=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Autenticar no Google Cloud (Workload Identity Federation)
        if: steps.cred.outputs.temos == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.RADAR_WIF_PROVIDER }}
          service_account: ${{ vars.RADAR_WIF_SERVICE_ACCOUNT }}

      - uses: actions/setup-python@v5
        if: steps.cred.outputs.temos == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        if: steps.cred.outputs.temos == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e "."

      # SEM `--base`: o default de `gerar_site` ja' e' a URL de producao. Passar
      # `--base` aqui e' justamente o erro que deixaria o site publicado cheio de
      # links para localhost.
      - name: Gerar o site
        if: steps.cred.outputs.temos == 'true'
        run: python -m scripts.gerar_site --saida site

      # Trava contra publicar um site quebrado: se `gerar_site` falhar no meio,
      # `site/` pode existir com um punhado de paginas. 529 fichas majoritarias +
      # listagens; 600 e' um piso folgado que so' cai se algo deu errado de verdade.
      - name: Conferir que o site esta' completo
        if: steps.cred.outputs.temos == 'true'
        run: |
          n=$(find site -name '*.html' | wc -l)
          echo "$n paginas HTML"
          if [ "$n" -lt 600 ]; then
            echo "::error::so' $n paginas — abaixo do piso de 600. Nao vai publicar."
            exit 1
          fi

      - name: Publicar na Hostinger (FTPS)
        if: steps.cred.outputs.temos == 'true'
        env:
          RADAR_FTP_HOST: ${{ secrets.HOSTINGER_HOST }}
          RADAR_FTP_USER: ${{ secrets.HOSTINGER_USER }}
          RADAR_FTP_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          RADAR_FTP_PORT: ${{ secrets.HOSTINGER_PORT }}
          RADAR_FTP_DIR: "/"
          # NAO e' segredo: e' o nome no certificado publico da Hostinger.
          # A conexao vai para RADAR_FTP_HOST; a verificacao TLS confere o
          # certificado contra ESTE nome, porque e' o que o servidor de
          # fato apresenta (Sectigo, *.hstgr.io). A cadeia e o hostname
          # seguem verificados — ver ADR-021.
          RADAR_FTP_TLS_NOME: "ftp.hstgr.io"
        run: python -m scripts.publicar --origem site
