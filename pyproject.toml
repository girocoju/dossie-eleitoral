[project]
name = "radar-brasil"
version = "0.1.0"
description = "Radar Brasil — Dossie Eleitoral 2026: pipeline TSE/IBGE/IPEA -> BigQuery -> dbt -> site estatico"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Data Duba Intelligence" }]

# O núcleo da ingestão é stdlib-only de proposito: download, parsing Latin-1,
# normalizacao e escrita NDJSON rodam sem nenhuma dependencia externa.
# Dependencias externas so entram na hora de FALAR com o BigQuery.
dependencies = [
  "google-cloud-bigquery>=3.25",
  "google-cloud-storage>=2.18",
  "PyYAML>=6.0",
  # Extracao do texto dos planos de governo (ADR-019). E' a unica dependencia do
  # nucleo que nao fala com nuvem: ler PDF em stdlib exigiria implementar o
  # formato, e uma transcricao errada deturpa a proposta de uma pessoa real.
  "pypdf>=5.0",
]

[project.optional-dependencies]
dbt = [
  "dbt-core>=1.8",
  "dbt-bigquery>=1.8",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
radar-tse = "ingest.tse:main"
radar-sidra = "ingest.ibge_sidra:main"
radar-ipea = "ingest.ipeadata:main"
radar-fotos = "ingest.fotos:main"
radar-propostas = "ingest.propostas:main"
radar-siconfi = "ingest.siconfi:main"
radar-ideb = "ingest.ideb:main"
radar-rtn = "ingest.rtn:main"
radar-planos = "ingest.planos:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "network: teste que precisa de internet (desliga com -m 'not network')",
  "bigquery: teste que precisa de credenciais GCP",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
