# Catalogo de indicadores socioeconomicos — F-04 / SPEC 3 (S6..S11).
#
# Este arquivo e' a FONTE UNICA da `dim_indicador` do SPEC 5: o seed
# `dbt/seeds/dim_indicador.csv` e' gerado daqui por `scripts/gerar_seeds.py` e um
# teste falha se os dois divergirem.
#
# `verificado` = a chamada real da API ja' foi conferida nesta base de codigo.
#   python -m ingest.ibge_sidra verify
#   python -m ingest.ipeadata  verify
#
# `direcao_desejavel` existe SO' para escolher a cor neutra de tendencia no Power BI
# (Constituicao 0.1). Nao e' juizo sobre gestao, e a tela nunca atribui a variacao
# a um mandato (Constituicao 0.2).
versao: 1

indicadores:

  # ── IBGE / SIDRA (S6) ────────────────────────────────────────────────
  PIB:
    nome: "Produto Interno Bruto a precos correntes"
    fonte: "IBGE — Contas Regionais (SIDRA t/5938)"
    unidade: "R$ mil correntes"
    periodicidade: anual
    direcao_desejavel: cima
    provedor: sidra
    verificado: true
    conferido_em: "2026-08-27"
    notas: "Divulgacao com ~2 anos de defasagem: em 08/2026 a serie termina em 2023."
    parametros:
      tabela: 5938
      variavel: 37
      niveis: [n1, n3]
      periodos: all

  POPULACAO:
    nome: "Populacao residente estimada"
    fonte: "IBGE — Estimativas de Populacao (SIDRA t/6579)"
    unidade: "pessoas"
    periodicidade: anual
    direcao_desejavel: neutro
    provedor: sidra
    verificado: true
    conferido_em: "2026-08-27"
    notas: "Serie 2001-2025. Usada tambem como denominador do PIB per capita."
    parametros:
      tabela: 6579
      variavel: 9324
      niveis: [n1, n3]
      periodos: all

  POPULACAO_CENSO:
    nome: "Populacao residente (Censo)"
    fonte: "IBGE — Censo Demografico 2022 (SIDRA t/4709)"
    unidade: "pessoas"
    periodicidade: decenal
    direcao_desejavel: neutro
    provedor: sidra
    verificado: true
    conferido_em: "2026-08-28"
    notas: >
      A tabela de ESTIMATIVAS (t/6579) nao publica anos de Censo — faltam 2007,
      2010 e 2022 (ver L-12). Sem populacao nesses anos, o PIB per capita ficava
      truncado em 2021, deixando incompleta a janela de todos os governadores
      eleitos em 2018. Esta serie preenche 2022 com o dado censitario.
      Fica como indicador SEPARADO de propositio: estimativa e censo tem
      metodologias diferentes, e o Censo 2022 corrigiu as estimativas de forma
      relevante. Junta-las numa serie unica sem marcar a origem esconderia uma
      quebra metodologica. O `fct_indicador_uf_ano` usa a estimativa e recorre ao
      censo so' onde ela nao existe, para calcular o PIB per capita.
      2023 continua sem populacao publicada em nenhuma das duas tabelas.
    parametros:
      tabela: 4709
      variavel: 93
      niveis: [n1, n3]
      periodos: all

  DESOCUPACAO:
    nome: "Taxa de desocupacao (14 anos ou mais)"
    fonte: "IBGE — PNAD Continua trimestral (SIDRA t/4099)"
    unidade: "%"
    periodicidade: anual
    direcao_desejavel: baixo
    provedor: sidra
    verificado: true
    conferido_em: "2026-08-27"
    notas: >
      A fonte e' trimestral desde 2012T1; o valor anual e' a MEDIA SIMPLES dos
      trimestres disponiveis no ano, e o ano so' entra se tiver os 4 trimestres
      (`min_periodos: 4`) — meio ano de dado nao vira "o ano".
    parametros:
      tabela: 4099
      variavel: 4099
      niveis: [n1, n3]
      periodos: all
      agregacao: media_anual
      min_periodos: 4

  RENDIMENTO_MEDIO:
    nome: "Rendimento medio mensal real do trabalho"
    fonte: "IBGE — PNAD Continua (SIDRA t/4566)"
    unidade: "R$ constantes"
    periodicidade: anual
    direcao_desejavel: cima
    provedor: sidra
    verificado: true
    conferido_em: "2026-08-28"
    notas: >
      Rendimento medio de quem tem 14 anos ou mais e esta' ocupado, por UF,
      2012-2025.

      E' a serie REAL, ja' deflacionada — e por isso a unica do projeto em R$
      CONSTANTES. PIB, receita, despesa e bens declarados sao todos nominais. Nao
      misture: uma variacao de 10% aqui significa ganho de poder de compra; uma
      variacao de 10% no PIB nominal pode ser so' inflacao.

      Sobre atribuicao: e' o indicador mais SENSIVEL a politica FEDERAL de todo o
      painel — salario minimo, inflacao e juros mexem nele muito mais do que
      qualquer decisao estadual. Vale a mesma regra dos demais (Constituicao 0.2),
      com um cuidado extra na pagina de Governadores.
    parametros:
      tabela: 4566
      variavel: 5935
      niveis: [n1, n3]
      periodos: all

  IPCA:
    nome: "Inflacao acumulada no ano (IPCA)"
    fonte: "IBGE — IPCA serie historica (SIDRA t/1737)"
    unidade: "% no ano"
    periodicidade: anual
    direcao_desejavel: baixo
    provedor: sidra
    verificado: true
    conferido_em: "2026-08-28"
    notas: >
      Indice oficial de inflacao do pais, 1980-2025. A fonte e' MENSAL e a variavel
      69 ja' vem ACUMULADA no ano, entao o valor anual e' o de dezembro — nao a
      media dos meses. Media de valores acumulados nao significa nada: janeiro
      acumula um mes e dezembro acumula doze, e a media daria cerca de metade da
      inflacao real. Por isso `agregacao: ultimo_do_ano` com `min_periodos: 12`.

      SERIE NACIONAL (n1), sem quebra por UF: o IPCA por regiao metropolitana
      existe nesta tabela, mas nao cobre as 27 UFs, e um comparador que so' tem
      metade dos estados nao serve de comparador.

      LEIA JUNTO COM O RENDIMENTO_MEDIO: os dois sao as duas metades da mesma
      pergunta. O rendimento ja' vem deflacionado, entao NAO desconte a inflacao
      dele de novo.
    parametros:
      tabela: 1737
      variavel: 69
      niveis: [n1]
      periodos: all
      agregacao: ultimo_do_ano
      min_periodos: 12

  # ── IPEA / Ipeadata (S7, S9) ─────────────────────────────────────────
  # SERCODIGO conferido por `python -m ingest.ipeadata verify`. Enquanto
  # `verificado: false`, o indicador NAO entra na carga automatica (--somente-verificados).
  HOMICIDIOS:
    nome: "Taxa de homicidios por 100 mil habitantes"
    fonte: "IPEA — Atlas da Violencia (Ipeadata)"
    unidade: "por 100 mil hab."
    periodicidade: anual
    direcao_desejavel: baixo
    provedor: ipeadata
    verificado: true
    conferido_em: "2026-08-27"
    notas: >
      Serie AVIOL12_THOMIC do Atlas da Violencia: Estados 1980-2024 (45 anos x 27 UFs)
      e Brasil no mesmo pacote. A resposta traz todos os niveis territoriais
      (467.988 linhas, ate' municipio) — o loader fica so' com Estados e Brasil.
    parametros:
      sercodigo: "AVIOL12_THOMIC"

  SELIC:
    nome: "Taxa de juros nominal — Over/Selic"
    fonte: "IPEA — Ipeadata macroeconomico (serie PAN_TJOVER)"
    unidade: "% a.a."
    periodicidade: anual
    direcao_desejavel: neutro
    provedor: ipeadata
    verificado: true
    conferido_em: "2026-08-28"
    notas: >
      Taxa basica de juros, media do ano, 1974-2025. Serie MACROECONOMICA: nao tem
      nivel territorial na resposta da API (`NIVNOME` vem vazio), e por isso o
      catalogo declara `macroeconomica: true` para o loader trata-la como nacional.
      So' existe `BR`, nunca UF.

      CUIDADO ESPECIAL DE LEITURA, maior que o das outras series. A Selic e'
      definida pelo COPOM, nao pelo Poder Executivo, e desde a LC 179/2021 o Banco
      Central tem autonomia formal, com mandatos do presidente e dos diretores
      DESCASADOS do mandato presidencial. Atribuir a taxa de juros a quem estava na
      Presidencia e' menos defensavel do que qualquer outro indicador do projeto —
      inclusive menos do que o PIB. Ela entra como CONTEXTO do periodo, e a tela
      diz isso (Constituicao 0.2).

      `direcao_desejavel: neutro` de proposito: juro alto nao e' "ruim" nem juro
      baixo "bom" — depende inteiramente da inflacao do momento. Colorir tendencia
      aqui seria editorializar.
    parametros:
      sercodigo: "PAN_TJOVER"
      macroeconomica: true
      niveis: [Estados, Brasil]

  MORTALIDADE_INFANTIL:
    nome: "Taxa de mortalidade infantil"
    fonte: "IBGE — Indicadores de Desenvolvimento Sustentavel (SIDRA t/3834)"
    unidade: "por mil nascidos vivos"
    periodicidade: anual
    direcao_desejavel: baixo
    provedor: sidra
    verificado: true
    conferido_em: "2026-08-28"
    notas: >
      Encontrada no IBGE, e nao no DATASUS: o TabNet e' formulario HTML e o Atlas
      do PNUD esta' inacessivel. A serie do IBGE vem por UF e ja' reconciliada,
      sem o vies de sub-registro que afeta a contagem bruta de obitos.

      LIMITE: termina em 2016. Mandatos posteriores nao tem este indicador, e a
      lacuna aparece na tela em vez de ser preenchida.

      Existe a t/7362 (Projecao da Populacao), que vai de 2000 a 2060 — mas e'
      tabela de PROJECAO: os anos futuros sao modelo, nao observacao, e mesmo os
      passados sao saida de modelo demografico. Usa-la exigiria suporte a
      classificacoes na ingestao do SIDRA (a serie fica numa classificacao `Ano`,
      e a tabela tem DUAS dimensoes chamadas Ano, o que quebra a deteccao
      automatica de periodo). Ver docs/LACUNAS.md, L-03.
    parametros:
      tabela: 3834
      variavel: 1940
      niveis: [n1, n3]
      periodos: all

  # ── Tesouro Nacional / SICONFI (S11) ─────────────────────────────────
  # E' o indicador com o vinculo mais forte com um mandato executivo: receita e
  # despesa do estado sao literalmente o que o governador administra. Isso nao
  # muda a Constituicao 0.2 — a tela continua descrevendo o periodo, com
  # comparador, sem atribuir merito. Muda que aqui a proximidade e' defensavel.
  RECEITA_ESTADUAL:
    nome: "Receita orcamentaria liquida do estado"
    fonte: "Tesouro Nacional — SICONFI/DCA (Anexo I-C)"
    unidade: "R$ correntes"
    periodicidade: anual
    direcao_desejavel: neutro
    provedor: siconfi
    verificado: true
    conferido_em: "2026-08-28"
    notas: >
      Receita bruta realizada menos as deducoes (FUNDEB e outras). A bruta
      superestima o que o estado dispoe: a parcela do FUNDEB e' vinculada por
      constituicao e sai antes. Cobertura 2015-2025; antes disso o anexo vem vazio.
    parametros:
      anexo: "DCA-Anexo I-C"
      conta: TotalReceitas
      ano_inicio: 2015

  DESPESA_ESTADUAL:
    nome: "Despesa orcamentaria empenhada do estado"
    fonte: "Tesouro Nacional — SICONFI/DCA (Anexo I-D)"
    unidade: "R$ correntes"
    periodicidade: anual
    direcao_desejavel: neutro
    provedor: siconfi
    verificado: true
    conferido_em: "2026-08-28"
    notas: >
      Despesa EMPENHADA, nao paga: o pagamento pode escorregar para o exercicio
      seguinte via restos a pagar, e o que mede a decisao tomada no ano e' o
      empenho. Cobertura 2015-2025.
    parametros:
      anexo: "DCA-Anexo I-D"
      conta: TotalDespesas
      ano_inicio: 2015

  PIB_PER_CAPITA:
    nome: "PIB per capita a precos correntes"
    fonte: "Calculado: IBGE t/5938 (PIB) / IBGE t/6579 (populacao)"
    unidade: "R$ correntes por habitante"
    periodicidade: anual
    direcao_desejavel: cima
    provedor: derivado
    verificado: true
    conferido_em: "2026-08-27"
    notas: >
      Nao existe variavel de PIB per capita por UF na t/5938; e' derivado.
      So' ha' valor nos anos em que PIB e populacao coexistem.
    parametros:
      formula: "PIB * 1000 / POPULACAO"
      depende_de: [PIB, POPULACAO]

  # ── Fontes de arquivo (S8, S10) — fase 3, ver docs/LACUNAS.md ────────
  RESULTADO_ORCAMENTARIO:
    nome: "Resultado orcamentario do estado"
    fonte: "Calculado: SICONFI receita liquida menos despesa empenhada"
    unidade: "R$ correntes"
    periodicidade: anual
    direcao_desejavel: cima
    provedor: derivado
    verificado: true
    conferido_em: "2026-08-28"
    notas: >
      Positivo = superavit, negativo = deficit. So' existe nos anos em que receita
      e despesa coexistem. NAO e' nota de gestao: um deficit pode vir de decisao
      deliberada de investimento, e um superavit de contingenciamento. A tela
      mostra o numero com o comparador, nunca um juizo.

      ATENCAO AO VISUAL: este e' o unico indicador do projeto que muda de SINAL.
      Variacao percentual sobre base negativa e' indefinida, e o modelo devolve
      NULL nesses casos de proposito — um estado que sai de -800 milhoes para
      +400 milhoes nao "cresceu X%". Use `variacao_abs` para este indicador; a
      percentual so' faz sentido quando as duas pontas sao positivas.
    parametros:
      formula: "RECEITA_ESTADUAL - DESPESA_ESTADUAL"
      depende_de: [RECEITA_ESTADUAL, DESPESA_ESTADUAL]

  IDHM:
    nome: "Indice de Desenvolvimento Humano Municipal (agregado por UF)"
    fonte: "IPEA — Atlas do Desenvolvimento Humano (Ipeadata, serie ADH_IDHM)"
    unidade: "indice 0-1"
    periodicidade: decenal
    direcao_desejavel: cima
    provedor: ipeadata
    verificado: true
    conferido_em: "2026-08-28"
    notas: >
      Vem pelo IPEADATA, nao pelo atlasbrasil.org.br. A lacuna L-05 registrava o
      Atlas como inalcancavel; a causa real, medida em 28/08/2026, e' que o
      certificado TLS de `www.atlasbrasil.org.br` venceu em 24/08/2026. Nao
      precisamos dele: a mesma serie do Atlas esta' publicada no Ipeadata, que o
      projeto ja' consome — zero codigo novo.

      TRES PONTOS, E O ULTIMO E' DE 2010: 1991, 2000 e 2010, por UF e Brasil. A
      atualizacao de 2021 do Atlas NAO esta' nesta serie do Ipeadata.

      ISSO LIMITA O USO A CONTEXTO HISTORICO. Nenhum mandato do escopo do projeto
      e' descrito por estes numeros — o mais recente e' anterior a todos os
      mandatos que o painel cobre. NAO entra em `fct_mandato_indicador` como
      variacao: serve para dizer de onde o estado partiu, nunca para sugerir que
      um governo levou o indice a algum lugar.
    parametros:
      sercodigo: "ADH_IDHM"

  IDEB:
    nome: "IDEB — anos finais do ensino fundamental (rede publica)"
    fonte: "INEP — IDEB (planilha de divulgacao por UF)"
    unidade: "indice 0-10"
    periodicidade: bienal
    direcao_desejavel: cima
    provedor: inep
    verificado: true
    conferido_em: "2026-08-28"
    notas: >
      ONZE EDICOES, 2005 a 2025, por UF e Brasil. E' a serie com melhor encaixe em
      janela de mandato de todo o projeto: um mandato de governador contem duas ou
      tres medicoes, contra uma unica do IDHM em trinta anos.

      Rede PUBLICA, nao "Total": incluir a rede privada mistura politica publica
      com escolha de familia, e a comparacao entre estados passaria a refletir
      tambem o tamanho do setor privado em cada um.

      Anos finais (6o ao 9o ano) porque e' o que o SPEC 3 (S8) especifica. As abas
      de anos iniciais e ENSINO MEDIO estao no mesmo arquivo e sao lidas pelo mesmo
      codigo — falta so' uma entrada de catalogo. O ensino medio e' o mais proximo
      da responsabilidade de um governador, por ser majoritariamente estadual; a
      pergunta esta' aberta no SPEC 11.

      Ate' 2021 o INEP publicava metas por ente federado. O projeto NAO ingere
      meta: "atingiu a meta" e' avaliacao, nao descricao (Constituicao 0.1).
    parametros:
      # O INEP publica UF e Brasil em arquivos separados, com nomes de aba
      # diferentes para a mesma etapa. Os dois sao declarados aqui em vez de
      # deduzidos: deduzir nome de aba e' como adivinhar nome de coluna do TSE.
      aba: "UF e Regiões (AF)"
      aba_brasil: "Brasil (Anos Finais)"
      rede: "Pública"

  # ── Tesouro Nacional / RTN (S18) ─────────────────────────────────────
  #
  # SUBSTITUEM as antigas RECEITA_UNIAO, DESPESA_UNIAO e
  # RESULTADO_ORCAMENTARIO_UNIAO, que vinham da DCA do SICONFI e NAO mediam
  # resultado fiscal: a receita da DCA inclui operacoes de credito (45% do total
  # da Uniao em 2020), entao receita menos despesa tendia a zero por identidade
  # contabil. Ver L-22 e ADR-017.
  #
  # Os ESTADOS continuam vindo do SICONFI: la' operacoes de credito sao 0,1% a
  # 1,1% da receita, e a DCA e' a fonte certa para eles.

  RECEITA_LIQUIDA_UNIAO:
    nome: "Receita liquida do Governo Central"
    fonte: "Tesouro Nacional — RTN, tabela 2.1"
    unidade: "R$ correntes"
    periodicidade: anual
    direcao_desejavel: neutro
    provedor: rtn
    verificado: true
    conferido_em: "2026-08-28"
    notas: >
      Receita primaria total menos transferencias por reparticao de receita a
      estados e municipios. NAO inclui operacoes de credito — e' essa a diferenca
      para a serie antiga vinda da DCA.

      `direcao_desejavel: neutro`: arrecadar mais nao e' em si bom nem ruim, e
      colorir tendencia aqui seria tomar partido numa discussao tributaria.
    parametros:
      aba: "2.1"
      rubrica: "3. RECEITA LIQUIDA"

  DESPESA_PRIMARIA_UNIAO:
    nome: "Despesa primaria total do Governo Central"
    fonte: "Tesouro Nacional — RTN, tabela 2.1"
    unidade: "R$ correntes"
    periodicidade: anual
    direcao_desejavel: neutro
    provedor: rtn
    verificado: true
    conferido_em: "2026-08-28"
    notas: >
      Despesa PRIMARIA: exclui juros da divida, que entram a' parte. E' o conceito
      usado na regra fiscal e o que a imprensa chama de "gasto".
    parametros:
      aba: "2.1"
      rubrica: "4. DESPESA TOTAL"

  RESULTADO_PRIMARIO_UNIAO:
    nome: "Resultado primario do Governo Central"
    fonte: "Tesouro Nacional — RTN, tabela 2.1 (acima da linha)"
    unidade: "R$ correntes"
    periodicidade: anual
    direcao_desejavel: cima
    provedor: rtn
    verificado: true
    conferido_em: "2026-08-28"
    notas: >
      Receita liquida menos despesa primaria, 1997-2025. Negativo e' deficit.
      E' o numero que a imprensa chama de "resultado primario" e o que a regra
      fiscal persegue — o mesmo conceito que o leitor tem na cabeca.

      Medicao "ACIMA DA LINHA" (linha 5 da tabela 2.1), que e' a manchete do RTN.
      A planilha traz tambem a medicao abaixo da linha, que difere por ajustes
      metodologicos e discrepancia estatistica; sao poucos bilhoes de diferenca e
      misturar as duas entre anos criaria degraus falsos.

      O QUE ESTA SERIE NAO E': o resultado do setor publico consolidado, que
      inclui estados, municipios e estatais. Aqui e' so' o Governo Central, que e'
      o nivel pelo qual um presidente responde.

      Assim como o PIB e a Selic, o numero descreve o PERIODO, nao o efeito de um
      mandato (Constituicao 0.2).
    parametros:
      aba: "2.1"
      rubrica: "5. RESULTADO PRIMARIO GOVERNO CENTRAL"
