# Layout canonico do TSE — base herdada por todos os anos.
# Cada campo lista os nomes de coluna aceitos, na ordem de preferencia.
# Fonte do mapeamento: leiame.pdf que acompanha cada pacote em
# https://dadosabertos.tse.jus.br/dataset/candidatos-<ano>
versao: 1
fonte: "TSE Dados Abertos"
base_url: "https://cdn.tse.jus.br/estatistica/sead/odsele"
encoding: "latin-1"
delimitador: ";"

# Constituicao 0.7 — dado pessoal que o projeto se recusa a persistir.
# `descartar` some antes do NDJSON (nem em `_extras` sobra).
# `hash` troca a coluna pelo HMAC-SHA256 do valor (ver ADR-006/ADR-007).
# O pacote do TSE traz, alem de um CSV por unidade eleitoral (`_AC`, `_SP`, `_BR`),
# um `_BRASIL` que e' o CONSOLIDADO de todas elas. Ler os dois duplica cada
# candidatura — conferido em 27/08/2026: 41.530 linhas para 20.765 candidaturas.
# Por isso `arquivo_regex` casa somente siglas de 2 letras. `ue_esperadas` e' a
# trava: a carga falha se o numero de unidades lidas nao bater.
ue_esperadas: 28   # 27 UFs + BR (unidade eleitoral da eleicao presidencial)

privacidade:
  descartar:
    - ds_email
    - nm_email
    - nr_titulo_eleitoral_candidato
    - nr_titulo_eleitoral
  hash:
    nr_cpf: cpf_hash

datasets:

  candidatos:
    pacote: "consulta_cand/consulta_cand_{ano}.zip"
    arquivo_regex: '^consulta_cand_{ano}_(?P<ue>[A-Z]{2})\.csv$'
    leiame: "consulta_cand/leiame-consulta_cand.pdf"
    # `sq_candidato` NAO e' global antes de 2010: em 2002 e 2006 e' um contador por
    # unidade eleitoral e repete ate' 27 vezes (uma por UE). Conferido em 27/08/2026
    # nos oito anos. So' com sg_ue + cd_eleicao a chave e' unica em todos eles.
    chave: ["ano_eleicao", "cd_eleicao", "sg_ue", "sq_candidato", "nr_turno"]
    obrigatorios:
      - ano_eleicao
      - nr_turno
      - sg_uf
      - cod_cargo
      - sq_candidato
      - nome_completo
      - sigla_partido
    campos:
      ano_eleicao:            [ANO_ELEICAO]
      cd_tipo_eleicao:        [CD_TIPO_ELEICAO]
      nm_tipo_eleicao:        [NM_TIPO_ELEICAO]
      nr_turno:               [NR_TURNO]
      cd_eleicao:             [CD_ELEICAO]
      ds_eleicao:             [DS_ELEICAO]
      dt_eleicao:             [DT_ELEICAO]
      tp_abrangencia:         [TP_ABRANGENCIA]
      sg_uf:                  [SG_UF]
      sg_ue:                  [SG_UE]
      nm_ue:                  [NM_UE]
      cod_cargo:              [CD_CARGO]
      ds_cargo:               [DS_CARGO]
      sq_candidato:           [SQ_CANDIDATO]
      nr_candidato:           [NR_CANDIDATO]
      nome_completo:          [NM_CANDIDATO]
      nome_urna:              [NM_URNA_CANDIDATO]
      nome_social:            [NM_SOCIAL_CANDIDATO]
      nr_cpf:                 [NR_CPF_CANDIDATO]          # descartado apos o hash (§0.7)
      cd_situacao_candidatura: [CD_SITUACAO_CANDIDATURA]
      situacao_candidatura:   [DS_SITUACAO_CANDIDATURA]
      cd_detalhe_situacao:    [CD_DETALHE_SITUACAO_CAND]
      ds_detalhe_situacao:    [DS_DETALHE_SITUACAO_CAND]
      tp_agremiacao:          [TP_AGREMIACAO]
      nr_partido:             [NR_PARTIDO]
      sigla_partido:          [SG_PARTIDO]
      nome_partido:           [NM_PARTIDO]
      sq_coligacao:           [SQ_COLIGACAO]
      nome_coligacao:         [NM_COLIGACAO]
      composicao_coligacao:   [DS_COMPOSICAO_COLIGACAO]
      nr_federacao:           [NR_FEDERACAO]
      sg_federacao:           [SG_FEDERACAO]
      nome_federacao:         [NM_FEDERACAO]
      composicao_federacao:   [DS_COMPOSICAO_FEDERACAO]
      cd_nacionalidade:       [CD_NACIONALIDADE]
      ds_nacionalidade:       [DS_NACIONALIDADE]
      sg_uf_nascimento:       [SG_UF_NASCIMENTO]
      nm_municipio_nascimento: [NM_MUNICIPIO_NASCIMENTO]
      data_nascimento:        [DT_NASCIMENTO]
      idade_data_posse:       [NR_IDADE_DATA_POSSE]
      cd_genero:              [CD_GENERO]
      genero:                 [DS_GENERO]
      cd_grau_instrucao:      [CD_GRAU_INSTRUCAO]
      grau_instrucao:         [DS_GRAU_INSTRUCAO]
      cd_estado_civil:        [CD_ESTADO_CIVIL]
      estado_civil:           [DS_ESTADO_CIVIL]
      cd_cor_raca:            [CD_COR_RACA]               # so' existe a partir de 2014
      cor_raca:               [DS_COR_RACA]
      cd_ocupacao:            [CD_OCUPACAO]
      ocupacao:               [DS_OCUPACAO]
      vr_despesa_max_campanha: [VR_DESPESA_MAX_CAMPANHA]
      cd_situacao_turno:      [CD_SIT_TOT_TURNO, CD_SITUACAO_CANDIDATO_TOT]
      situacao_turno:         [DS_SIT_TOT_TURNO, DS_SITUACAO_CANDIDATO_TOT]
      st_reeleicao:           [ST_REELEICAO]
      st_declarar_bens:       [ST_DECLARAR_BENS]
      nr_processo:            [NR_PROCESSO]

  bens:
    pacote: "bem_candidato/bem_candidato_{ano}.zip"
    arquivo_regex: '^bem_candidato_{ano}_(?P<ue>[A-Z]{2})\.csv$'
    leiame: "bem_candidato/leiame-bem_candidato.pdf"
    chave: ["ano_eleicao", "sg_ue", "sq_candidato", "nr_ordem_bem"]
    obrigatorios:
      - ano_eleicao
      - sq_candidato
      - valor_bem
    campos:
      ano_eleicao:      [ANO_ELEICAO]
      cd_tipo_eleicao:  [CD_TIPO_ELEICAO]
      cd_eleicao:       [CD_ELEICAO]
      ds_eleicao:       [DS_ELEICAO]
      sg_uf:            [SG_UF]
      sg_ue:            [SG_UE]
      nm_ue:            [NM_UE]
      sq_candidato:     [SQ_CANDIDATO]
      nr_ordem_bem:     [NR_ORDEM_BEM_CANDIDATO, NR_ORDEM_CANDIDATO]
      cd_tipo_bem:      [CD_TIPO_BEM_CANDIDATO]
      ds_tipo_bem:      [DS_TIPO_BEM_CANDIDATO]
      ds_bem:           [DS_BEM_CANDIDATO]
      valor_bem:        [VR_BEM_CANDIDATO]
      dt_ultima_atualizacao: [DT_ULTIMA_ATUALIZACAO]

  vagas:
    pacote: "consulta_vagas/consulta_vagas_{ano}.zip"
    arquivo_regex: '^consulta_vagas_{ano}_(?P<ue>[A-Z]{2})\.csv$'
    leiame: "consulta_vagas/leiame-consulta_vagas.pdf"
    # `cd_eleicao` e' obrigatorio na chave: o pacote de um ano pode conter mais de
    # uma eleicao. O de 2022, por exemplo, traz linhas da "Eleicao Suplementar
    # Governador 2026"; o de 1998 traz 1o e 2o turno como eleicoes distintas.
    chave: ["ano_eleicao", "cd_eleicao", "sg_ue", "cod_cargo"]
    obrigatorios:
      - ano_eleicao
      - cod_cargo
      - qt_vagas
    campos:
      ano_eleicao:  [ANO_ELEICAO]
      cd_eleicao:   [CD_ELEICAO]
      ds_eleicao:   [DS_ELEICAO]
      dt_eleicao:   [DT_ELEICAO]
      nr_turno:     [NR_TURNO]
      sg_uf:        [SG_UF]
      sg_ue:        [SG_UE]
      nm_ue:        [NM_UE]
      cod_cargo:    [CD_CARGO]
      ds_cargo:     [DS_CARGO]
      qt_vagas:     [QT_VAGA, QT_VAGAS]   # 2026 usa QT_VAGA (singular) — conferido 27/08/2026
      dt_posse:     [DT_POSSE]

  # S4 — votacao por candidato, municipio e zona. E' a maior fonte do projeto:
  # ~2 GB somando as sete eleicoes, e 10 milhoes de linhas por pleito. Vai para o
  # BigQuery AGREGADA por candidatura (SPEC S4: "agregar para UF antes de subir").
  votacao:
    pacote: "votacao_candidato_munzona/votacao_candidato_munzona_{ano}.zip"
    # ATENCAO: aqui o `_BRASIL` e' o arquivo CERTO, ao contrario de todos os
    # outros datasets. Conferido em 1998: o pacote traz 26 arquivos por UF mais um
    # `_BRASIL`, e o DISTRITO FEDERAL nao tem arquivo proprio — existe so' dentro
    # do BRASIL. Ler os 26 perderia o DF inteiro; ler os 27 duplicaria tudo.
    # O BRASIL contem as 27 UFs e os seis cargos.
    arquivo_regex: '^votacao_candidato_munzona_{ano}_BRASIL\.csv$'
    # O grao de saida nao carrega `sg_uf`, entao a contagem de unidades nao se
    # aplica aqui — a integridade e' garantida pela chave, nao pela contagem.
    ue_esperadas: 0
    leiame: "votacao_candidato_munzona/leiame-votacao_candidato_munzona.pdf"
    # Grao de SAIDA: candidatura x turno x UF onde o voto foi depositado.
    #
    # Usa `sg_uf`, e NAO `sg_ue`, porque o significado de SG_UE muda entre anos:
    # em 1998 e' a UF; em 2002 e' o CODIGO DO MUNICIPIO para todo cargo que nao
    # seja presidente (conferido: 5.566 valores distintos, e a agregacao explodiu
    # de 14 mil para 1,37 milhao de grupos). `SG_UF` e' consistente nos dois.
    #
    # A unidade DISPUTADA — que e' o que compoe a `sk_candidatura` — e' derivada
    # no dbt: `BR` para presidente, a propria UF para os demais cargos. E' la'
    # tambem que os votos de um presidenciavel, espalhados por 27 UFs mais `ZZ`
    # (exterior), viram uma linha so'.
    agregar_por: ["ano_eleicao", "cd_eleicao", "sg_uf", "cod_cargo",
                  "sq_candidato", "nr_turno"]
    somar: ["qt_votos_nominais", "qt_votos_nominais_validos"]
    chave: ["ano_eleicao", "cd_eleicao", "sg_uf", "cod_cargo", "sq_candidato", "nr_turno"]
    obrigatorios:
      - ano_eleicao
      - sq_candidato
      - nr_turno
      - cod_cargo
      - sg_uf
    campos:
      ano_eleicao:               [ANO_ELEICAO]
      cd_eleicao:                [CD_ELEICAO]
      ds_eleicao:                [DS_ELEICAO]
      nr_turno:                  [NR_TURNO]
      sg_uf:                     [SG_UF]
      sg_ue:                     [SG_UE]
      nm_ue:                     [NM_UE]
      cod_cargo:                 [CD_CARGO]
      ds_cargo:                  [DS_CARGO]
      sq_candidato:              [SQ_CANDIDATO]
      nr_candidato:              [NR_CANDIDATO]
      nome_urna:                 [NM_URNA_CANDIDATO]
      sigla_partido:             [SG_PARTIDO]
      situacao_turno:            [DS_SIT_TOT_TURNO]
      # 1998 traz QT_VOTOS_NOMINAIS ZERADO e o valor em _VALIDOS (conferido no AC:
      # 0 contra 762.844). Os dois sao somados e o dbt escolhe — ver stg_tse__votacao.
      qt_votos_nominais:         [QT_VOTOS_NOMINAIS]
      qt_votos_nominais_validos: [QT_VOTOS_NOMINAIS_VALIDOS]

  coligacoes:
    pacote: "consulta_coligacao/consulta_coligacao_{ano}.zip"
    arquivo_regex: '^consulta_coligacao_{ano}_(?P<ue>[A-Z]{2})\.csv$'
    leiame: "consulta_coligacao/leiame-consulta_coligacao.pdf"
    # Grao conferido em 27/08/2026: uma linha por PARTIDO dentro da coligacao,
    # por cargo. `sq_coligacao` sozinho repete ate' 18 vezes (uma federacao com
    # muitos partidos), entao nao e' chave.
    # `sq_coligacao` tambem nao e' global antes de 2010 — o valor `1000` aparece
    # em varias UFs no mesmo ano.
    chave: ["ano_eleicao", "cd_eleicao", "sg_ue", "sq_coligacao", "sigla_partido", "cod_cargo"]
    obrigatorios:
      - ano_eleicao
      - sq_coligacao
    campos:
      ano_eleicao:          [ANO_ELEICAO]
      cd_eleicao:           [CD_ELEICAO]
      ds_eleicao:           [DS_ELEICAO]
      nr_turno:             [NR_TURNO]
      sg_uf:                [SG_UF]
      sg_ue:                [SG_UE]
      nm_ue:                [NM_UE]
      cod_cargo:            [CD_CARGO]
      ds_cargo:             [DS_CARGO]
      tp_agremiacao:        [TP_AGREMIACAO]
      nr_partido:           [NR_PARTIDO]
      sigla_partido:        [SG_PARTIDO]
      nome_partido:         [NM_PARTIDO]
      sq_coligacao:         [SQ_COLIGACAO]
      nome_coligacao:       [NM_COLIGACAO]
      composicao_coligacao: [DS_COMPOSICAO_COLIGACAO]
